# The slow lane -- QT_CI_PLAN.md Phase 6 -- and, since 2026-09-04, a
# RELEASE GATE rather than a nightly.
#
# Everything here is what CLAUDE.md calls "pre-release rather than
# pre-commit". It has a record: the warning audit's first run found that
# Makefile.win had not compiled for 62 commits, the first run of each
# half of the sanitizer sweep found real out-of-bounds bugs in code that
# had been exercised dozens of times without a sanitizer behind it, and
# the Swiss oracle is the only net in the project that can say a number
# is right rather than unchanged.
#
# It used to run on a schedule, and the schedule was the wrong shape for
# it, for three reasons that were all measured before it was removed:
#
#   - It gated nothing. The strongest checks in the repository ran on a
#     timer nobody was required to read, which is why
#     tools/ci-assert-slow-lane.sh had to be written: the lane sat red
#     for days while work continued against it.
#   - The schedule had fired once in its life. Every other run was a
#     manual dispatch. And GitHub disables scheduled workflows in a
#     repository with no pushes for 60 days, so on a fork that goes
#     quiet it would have stopped existing silently, leaving a green
#     history behind it.
#   - "If nothing changes and nothing is released, no action is needed."
#     The maintainer's framing, and the right one: these checks are
#     about what ships. They run when something is about to.
#
# So release.yml calls this workflow and its Publish job needs every job
# here, which makes each of them a gate on the release. workflow_dispatch
# stays for running it by hand against any commit -- cheap, and the only
# way to get a macOS artifact without spending a version number.
#
# The two jobs that were "continue-on-error experiments" -- macOS, and
# the Qt build on Windows -- are experiments no longer. macOS produces
# the .dmg the release ships and is a gate; the Windows build moved to
# windows-qt.yml, where it produces the Windows package, and is a gate
# there. Neither can be falsified from the maintainer's machine, which
# has no macOS and no MSVC; both have been green for long enough to be
# trusted with that caveat said out loud.
#
# Most jobs here run on ubuntu-22.04, for the glibc that governs what the
# packages can link against. The warnings job does not, since 2026-09-04:
# it used to be pinned there for its compiler, because tools/warnings.txt
# was a ledger of what g++ 11 says, and it is on ubuntu-latest now
# because that ledger is empty and a newer compiler finding something is
# what the job is for. The job's own comment has the measurements.

name: Slow lane

on:
  workflow_call:
  workflow_dispatch:

# No concurrency group of its own. Called from release.yml it runs under
# that workflow's group, which never cancels; dispatched by hand, two
# runs at once are merely wasteful.

permissions:
  contents: read

jobs:
  # What does the whole test apparatus never execute? Every other job here
  # answers "did this change?"; this one answers "is this reached at all?",
  # and it exists because "-XE 1 20" sat inert in the graphics matrix from
  # the day it was written -- an entry that changes nothing still diffs to
  # zero, which is what a passing differential looks like.
  #
  # It gates on an EXACT set, and since 2026-09-04 that set is EMPTY: the
  # two files it used to name, placalc.cpp and placalc2.cpp, were removed
  # rather than tested once the report had shown nothing reached them. A
  # file joining the set means new code arrived with no net, or a harness
  # stopped reaching what it used to.
  #
  # Slow by construction: the instrumented build is -O0 and the switch
  # matrix alone is 529 invocations, plus the whole suite.
  coverage:
    name: What nothing executes
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the build dependencies
        run: tools/ci-deps.sh libx11-dev qtbase5-dev pkg-config
      - name: Coverage of the four matrices and the Qt suite
        run: tools/coverage-report.sh out/coverage

      - name: Say so in the run summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            head -14 out/coverage/coverage.txt 2>/dev/null || echo "(no report)"
            echo '```'
            echo
            echo "Executed by neither the matrices nor the suite:"
            echo '```'
            cat out/coverage/dead.txt 2>/dev/null || echo "(none recorded)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: out/coverage

  # 6.2. Four sanitizer-class checks, FOUR JOBS. They ran as four serial
  # steps of one job until 2026-09-04: 335 s of ASan over the matrices,
  # then 271 s of UBSan, then 257 s of the Qt suite under ASan, then 33 s
  # of the Swiss oracle -- 919 of a release's 959 seconds, on one runner,
  # under one name. In parallel the release's wall time is about seven
  # minutes instead of sixteen, and a failure is named for the sanitizer
  # that found it rather than "AddressSanitizer sweep" when UBSan fired.
  # Same runner minutes; less waiting; better names.
  #
  # Each job installs its own dependencies; the apt lines are the ones
  # every job here carries, with the IPv4 forcing that a fourteen-minute
  # mirror wait bought.
  #
  # /swe will never exist here, so the sweeps run against the bundled
  # ephemeris. The switch half never needed it; the graphics half is the
  # one that used to be claimed impossible without it, and that claim
  # was retracted on 2026-09-02 after measurement -- 224 renders, 0
  # missing, on ephem/.
  #
  # The path must be ABSOLUTE. asan-sweep.sh builds its binary at
  # /tmp/astrolog-asan-sweep -- deliberately, since the binary needs a
  # short path -- and Astrolog resolves a relative -Yi1 against the
  # executable's own directory, so "-Yi1 ephem" there means /tmp/ephem,
  # which does not exist. The sweep would still run and still find
  # memory errors, but every body would fall back to Moshier and the
  # ephemeris code paths would go unexercised, silently. Same trap as
  # item 7.2b's baseline binary, from the other end.
  # Two jobs for the two surfaces, since 2026-09-04 (late): with the four
  # sanitizer checks already in parallel, "both surfaces" in one job was
  # the release's long pole at 417 s, and asan-sweep.sh takes the surface
  # as its argument. Each builds its own instrumented binary; the
  # matrices are disjoint, so nothing is measured twice.
  asan-switches:
    name: ASan over the switch matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the console build's dependencies
        run: tools/ci-deps.sh libx11-dev
      - name: The 529-invocation switch matrix
        env:
          ASAN_SWEEP_CFG: -Yi1 ${{ github.workspace }}/ephem
        run: tools/asan-sweep.sh switches

  asan-graphics:
    name: ASan over the graphics matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the console build's dependencies
        run: tools/ci-deps.sh libx11-dev
      - name: Every graphics render
        env:
          ASAN_SWEEP_CFG: -Yi1 ${{ github.workspace }}/ephem
          GRAPHICS_MATRIX_CFG: -Yi1 ${{ github.workspace }}/ephem
        run: tools/asan-sweep.sh graphics

  # UndefinedBehaviorSanitizer, which is a different net rather than a
  # cheaper one. ASan finds memory errors; UBSan finds signed overflow,
  # invalid shifts, misaligned access and bad conversions -- and this
  # codebase is overwhelmingly arithmetic, which is UBSan's territory
  # and was nobody's until now. Clean on its first sweep, which makes it
  # a baseline of zero rather than a cleanup project.
  #
  # qtbase5-dev is installed HERE, because ubsan-sweep.sh's Qt leg asks
  # for a Qt build and, with Qt absent, printed "no Qt build available,
  # skipped" and moved on -- so the leg that found two real bugs on that
  # surface (an 8-byte store into a 4-byte metafile field, and a read one
  # past the end of space[]) contributed nothing to the runs it was in.
  # tools/ci-assert-slow-lane.sh reads passing logs for exactly that
  # kind of skip.
  ubsan:
    name: UBSan over the matrices and the Qt suite
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install both builds' dependencies
        run: tools/ci-deps.sh libx11-dev qtbase5-dev pkg-config
      - name: UndefinedBehaviorSanitizer over both matrices
        run: tools/ubsan-sweep.sh

  # A third surface the matrix sweep does not reach. asan-sweep.sh builds
  # its own CONSOLE binary and drives the switch matrix and the graphics
  # renders; the Qt suite -- every dialog and menu -- ran under no
  # sanitizer at all, even though "make qt-asan" has existed the whole
  # time and CLAUDE.md called the suite "clean under AddressSanitizer".
  #
  # It was not, on 2026-09-03. A mechanical sweep replacing POSIX calls
  # with Qt ones left
  #
  #   szTmp = QDir::tempPath().toLocal8Bit().constData();
  #
  # where the QByteArray is a temporary and szTmp dangles at the
  # semicolon. Linux read bytes nothing had reused and passed; macOS
  # segfaulted. This build reports it as a plain heap-use-after-free in
  # one run -- so it was catchable here all along, by a net nobody had
  # strung.
  #
  # detect_leaks=0 because a Qt harness that exits without unwinding its
  # widgets leaks by construction: 10,769 bytes in 115 allocations, none
  # of it a defect this is looking for.
  qt-asan:
    name: The Qt suite under ASan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the Qt build's dependencies
        run: tools/ci-deps.sh libx11-dev qtbase5-dev pkg-config
      - name: The Qt suite under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORMTHEME: ''
        run: |
          make qt-asan -j4
          ASTROLOG_QT_EPHEM=minimal ./astrolog-qt-asan -Yi1 ephem

  # The one check here whose reference comes from OUTSIDE this
  # repository. Everything else compares Astrolog to an older build of
  # itself or to the other build of the same core -- REFACTORING.md T9
  # says so, and adds that a differential "actively protects a wrong
  # answer". qttest.cpp's numeric oracle looks like the exception and is
  # not one: it links the SAME vendored Swiss, so a wrong Jupiter would
  # appear identically on both sides and agree perfectly.
  #
  # UPSTREAM Swiss Ephemeris, aloistr/swisseph, SE_VERSION "2.10.03" --
  # exactly the version this tree vendors. The reference should be the
  # canonical source at the same version rather than anybody's fork, so
  # a disagreement means "Astrolog's integration is wrong" and not "the
  # two Swisses differ". Clone plus build measured at under 25 seconds.
  #
  # A plain build, not a sanitized one, on purpose: this check is about
  # whether a NUMBER is right. An instrumented binary would give the
  # same answer several times slower, and the sanitizers have their own
  # jobs. (When the four shared a job, ./astrolog did not exist at this
  # point -- both sweeps "make clean" on either side of their own builds
  # -- and the step failed on every run until it built its own.)
  oracle:
    name: Astrolog against upstream Swiss Ephemeris
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the console build's dependencies
        run: tools/ci-deps.sh libx11-dev
      - name: Astrolog against upstream Swiss Ephemeris's own swetest
        run: |
          make astrolog -j4
          git clone -q --depth 1 https://github.com/aloistr/swisseph.git /tmp/swe
          make -C /tmp/swe swetest -j4 >/dev/null
          tools/swetest-oracle.sh ./astrolog /tmp/swe/swetest "$PWD/ephem"

  # 6.4b. The cheap Windows differential: the whole 71-invocation chart
  # matrix run against astrolog-wcli.exe under Wine and byte-diffed
  # against the Linux console build, with no display, no window manager
  # and no input simulation. 24 seconds here.
  #
  # It is in the slow lane only because installing Wine is not cheap; the
  # harness itself is fast enough for the fast lane, and if the install
  # ever stops dominating, move it.
  #
  # It exercises the shared core as compiled by mingw for Windows, which
  # is where a portability difference would live. It compiles neither
  # wdriver.cpp nor wdialog.cpp, so it says nothing about the Windows GUI
  # -- a complement to the oracle, never a replacement.
  # 6.3 rides along in the same job. tools/win-tests.sh drives the real
  # astrolog.exe through a window under Xvfb, which is the ONLY thing in
  # this repository that exercises wdriver.cpp and wdialog.cpp
  # behaviourally -- the differential above compiles neither. Both halves
  # want Wine, and installing it is the expensive part, so they share a
  # job rather than paying for it twice.
  windows:
    name: Windows parity
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the cross toolchain and Wine
        run: tools/ci-deps.sh --i386 g++-mingw-w64-x86-64 libx11-dev wine wine64 xvfb metacity xdotool imagemagick
      - name: Build all three binaries
        run: make astrolog -j4 && make wcli -j4 && make -f Makefile.win -j4

      # Wine writes a prefix on first run and takes a while doing it; get
      # that out of the way before anything is timed or diffed.
      - name: Initialise the Wine prefix
        run: wineboot --init 2>/dev/null || true

      # Path handling first: it is seconds, and it is the surface the
      # chart differential structurally cannot see. win-differential.sh
      # diffs what the two builds COMPUTE; this asks what the ephemeris
      # search path ends up CONTAINING, which is where the platforms
      # actually differ -- a different CRT, a different stat(), drive
      # letters. A real bug shipped in that gap; see work log item 179.
      - name: Windows path handling
        run: tools/win-console-checks.sh

      # The packaged .exe starts. QT_CI_PLAN.md item 4.4 records that the
      # Windows half of the package check is open because astrolog.exe has
      # no console entry point and cannot be driven to write a chart and
      # exit -- re-tested and still true. This asserts the weaker thing
      # nothing asserted at all: that the binary a user unpacks runs, finds
      # what it needs and puts up its own window.
      - name: The packaged Windows program starts
        run: |
          tools/package.sh windows out/pkg
          tools/ci-verify-windows-starts.sh out/pkg/astrolog-windows

      - name: Diff the whole chart matrix
        run: tools/win-differential.sh out/win-diff

      # 6.3. Every tools/scenarios/win-*.txt, driven through a real window.
      # windrive.sh starts its own Xvfb and its own metacity, and starts
      # metacity with PULSE_SERVER=/nonexistent because it plays the X bell
      # through the speakers and Astrolog rings the bell on every keystroke
      # it does not handle. Both builds need a window manager -- Wine will
      # not give a new dialog keyboard focus without one.
      #
      # It swaps /swe for the bundled ephem/ in a COPY of nrvate.as before
      # running: ~887,000 files through Wine's path translation is
      # indistinguishable from the app hanging. On a runner there is no
      # /swe at all, so the swap is a no-op -- which is the case to watch,
      # since a no-op swap and a broken one look identical from here.
      - name: The Windows GUI scenarios
        run: tools/win-tests.sh

      - name: Keep the diff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-differential
          path: out/win-diff/*.diff
          if-no-files-found: ignore

  # Phase 9. Scoped to "it compiles and the suite passes", because the
  # maintainer owns no Apple hardware and nothing beyond that can be
  # verified here. The deliverable is adoptability: a dated, reproducible
  # statement that the port builds and passes on macOS, which is what
  # someone considering picking up the Mac side cannot find out without
  # doing the work first.
  #
  # IT IS IN THE SLOW LANE AND NOT THE FAST ONE, and it took a wasted
  # runner to learn why. The first attempt ran "brew install qt@5", which
  # Homebrew has deprecated -- so instead of pouring a bottle it started
  # building Qt from source, and sat there for over ten minutes inside a
  # workflow whose whole run is otherwise four.
  #
  # Qt6, not Qt5, for the same reason: it is a current bottle and installs
  # in seconds, and Makefile.qt picks its modules from pkg-config, so
  # nothing else changes. The EL10 and Fedora packages are built against
  # Qt6 too.
  #
  # TWO THINGS TO READ HONESTLY. This is one of two jobs that were NOT
  # falsified before being trusted -- it cannot be, from a machine with
  # no macOS. And since 2026-09-04 it GATES: the .dmg it uploads is the
  # one the release publishes, so the shipped Mac binary is one that has
  # passed the suite, which release.yml's own macOS job never ran. A
  # green result says the suite passed offscreen; it does not say a
  # person can use the menus. QT_CI_PLAN.md item 9.3 lists what nobody
  # has looked at.
  macos:
    name: macOS build + suite
    runs-on: macos-latest
    env:
      QT_VERSION: "6.8.3"
      # The lowest macOS Qt 6.8 runs on. Without it clang records the
      # host's version as the binary's minimum -- 26.0 on this runner --
      # and package-macos.sh, which reads the minimum off the bundle
      # rather than asserting one, wrote that into the .dmg.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    # Build is about two minutes -- Qt6 pours in 59s and the port compiles
    # in 61s, both measured. The suite is 47s on Linux, six minutes here,
    # and the .dmg is another minute. Twenty-five is generous for that
    # and cheap when something hangs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pkg-config
        run: brew install pkg-config

      # Qt is PINNED here, not "brew install qt": until 2026-09-05 the
      # .dmg a release shipped was built against whatever Qt Homebrew
      # carried that day, on the one platform nobody working on this can
      # open. Same version as Windows, same installer, cached the same
      # way; the script writes the pkg-config files the installer's
      # package lacks, and says why. The key names everything that
      # decides what the cache holds.
      - name: Cached Qt
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0, Node 24
        with:
          path: ~/Qt
          key: qt-mac-${{ env.QT_VERSION }}-clang_64-qtbase-qttools-aqt3.3.0-nodsym
      - name: Qt ${{ env.QT_VERSION }}, pinned
        run: tools/ci-macos-qt.sh "$QT_VERSION" "$HOME/Qt" >> "$GITHUB_ENV"

      # Keep the build log. tools/warning_audit.py covers five GCC builds
      # and knows nothing about clang, so this job compiled 260 warnings a
      # night that nobody read -- all of them 'sprintf' is deprecated, all
      # of them in vendored Swiss Ephemeris, and none in a file this
      # codebase wrote.
      # "shell: bash" is GitHub's "bash -eo pipefail"; the default is "-e"
      # alone, under which this pipeline reports tee's exit status and a
      # failed make read as a green step -- which it did on 2026-09-05,
      # with the suite step then failing on "build it first" and the
      # compiler's own error sitting unread in build.log.
      - name: Build
        shell: bash
        run: make qt -j4 2>&1 | tee build.log && make qt-test -j4 2>&1 | tee -a build.log

      - name: No clang warnings in our own sources
        run: tools/ci-assert-clang-clean.sh build.log 300

      # The suite, bounded and diagnosable: tools/ci-run-suite.sh is the
      # forty lines that lived here until 2026-09-05 -- watchdog, process
      # group, pty, log read after the fact -- each learned from a run
      # that lost its own diagnostic, and each falsifiable on a laptop now
      # ("tools/ci-run-suite.sh 5 x.log" shows the kill path in five
      # seconds). ci.yml runs the suite through the same script, so Linux
      # and macOS share one watchdog rather than one platform's copy.
      - name: Run the suite
        env:
          ASTROLOG_QT_EPHEM: minimal
        run: tools/ci-run-suite.sh 420 suite.log -Yi1 ephem

      # The log leaves the runner whether the suite passed or not. "tail
      # -80" is enough to see where a failure stopped and not enough for
      # anything else -- 32 of the 48 groups' assertion counts scroll off
      # the top, and those are what tells you a group was skipped rather
      # than run. Four separate fixes to this step have now been about it
      # discarding its own evidence.
      #
      # The count to expect here is six below Linux's, and the log this
      # step uploads is what proves the six are benign (the numbers below
      # are the 2026-09-03 measurement; the totals have grown since). Diffing the
      # per-group assertion counts against a Linux run of the same
      # configuration gives 48 groups on both sides and exactly one line
      # of difference:
      #
      #   < [Firing every menu item: 957 assertions]
      #   > [Firing every menu item: 951 assertions]
      #
      # Six, in the one group that skips the Print item -- QPrintDialog is
      # the native NSPrintPanel here and runs its own Cocoa modal loop, so
      # the closer this group arms never gets a turn. Every other group
      # runs the same number of assertions on both platforms, which is the
      # thing worth knowing: a lower total is otherwise indistinguishable
      # from a group that silently did not run.
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-suite-log
          path: suite.log
          retention-days: 14

      # Build the .dmg here too, not only in release.yml. Packaging that
      # runs once per release is packaging that breaks between releases
      # and tells you at the worst moment -- the same argument that put
      # the Windows and Linux packages in this pipeline rather than in a
      # release checklist. It costs about two minutes on a job that
      # already has Qt installed and the port built.
      #
      # tools/package-macos.sh runs the bundled binary and requires a
      # Chiron line, so a break in macdeployqt's library rewriting, in the
      # A LOOK at the thing, which no assertion gives. The suite proves
      # every dialog opens and carries the right title; it cannot say
      # whether a control sits off the edge, a label is truncated, or a
      # layout collapses under a platform's default font. Those are the
      # failures a picture catches, and macOS is where they would show
      # first, because nobody working on this has a Mac to look at one on.
      #
      # QWidget::grab() paints through Qt rather than asking the window
      # system for pixels, so it runs under the offscreen platform with no
      # display. Charts too: QTGRAPHDIR was never set on this runner, so
      # the drawing code had no macOS capture of any kind.
      - name: Screenshot every dialog, and every chart type
        if: always()
        run: |
          export QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME=
          QTSHOTDIR=out/shots ./astrolog-qt-test -Yi1 ephem || true
          QTGRAPHDIR=out/charts ./run-qt-tests.sh -Yi1 ephem >/dev/null 2>&1 || true
          echo "dialogs: $(ls out/shots 2>/dev/null | wc -l)  charts: $(ls out/charts 2>/dev/null | wc -l)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-screenshots
          path: |
            out/shots
            out/charts
          if-no-files-found: warn

      # ad-hoc signature, or in the data layout fails here rather than in
      # a user's Downloads folder.
      - name: Build the .app and .dmg
        run: tools/package-macos.sh out/macos

      # This .dmg is the one the release ships: release.yml's Publish job
      # downloads every "astrolog-*" artifact of its run, and this job is
      # called from it. A dispatched run makes the same artifact, which
      # is the thing to hand somebody who says "does this run on your
      # Mac?" without spending a version number on it.
      - name: Say so in the run summary
        if: always()
        run: |
          {
            echo "### macOS"
            echo "- suite: $(grep -hoE '^(PASS|FAIL): .*' suite.log 2>/dev/null | tail -1 || echo 'did not report')"
            if ls out/macos/*.dmg >/dev/null 2>&1; then
              echo "- packaged: $(ls -lh out/macos/*.dmg | awk '{print $9" "$5}')"
            else
              echo "- **no .dmg produced**"
            fi
            echo "- job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolog-macos
          path: out/macos/*.dmg
          if-no-files-found: error

  # Q11 answered 2026-09-02: repair it and build it. Astrolog.vcxproj had
  # been one <ClCompile> line behind since a78436f added switch.cpp, and
  # rotting quietly is what happens to every configuration nothing
  # compiles -- this repository has now found that three times (WCLI,
  # Qt6, and this). One job makes it real.
  #
  # IN THE SLOW LANE SINCE 2026-09-04, not the fast one. It compiles the
  # Win32 build -- wdriver.cpp under MSVC -- which since that morning is
  # the oracle and not the product; the Qt build that ships is compiled
  # with MSVC on every push by windows-qt.yml, and the mingw build in
  # ci.yml still guards "Makefile.win compiles" in two minutes on Linux.
  # A Windows runner per push for a configuration whose only consumer is
  # tools/vcxproj_audit.py was the wrong price for it. Here it gates a
  # release, which is when a vcxproj that has stopped compiling matters.
  #
  # It is the only job in this lane not also runnable on the maintainer's
  # machine, since MSVC is Windows-only. That is the cost of keeping the
  # configuration, and it is why the project file is checked against
  # Makefile.srcs by the audits as well: a missing source should fail on
  # Linux in a second, not on a Windows runner in a minute.
  msvc:
    name: MSVC project
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # v142 is the toolset the project asks for and windows-latest does
      # not ship it, so it retargets to whatever is installed. That is the
      # honest thing for a file this fork does not otherwise maintain:
      # the question is whether the SOURCE still compiles under MSVC, not
      # whether a 2019 toolset is still available.
      - name: Build
        run: msbuild Astrolog.vcxproj -p:Configuration=Release -p:Platform=Win32 -p:PlatformToolset=v143 -v:minimal

      - name: The binary exists and is new
        shell: bash
        run: |
          find . -name 'Astrolog.exe' -newer Astrolog.vcxproj | grep . || {
            echo "MSVC produced no Astrolog.exe newer than the project file"; exit 1; }

  # The newest PUBLISHED release, verified the way a user does: the
  # manifest must name exactly the assets GitHub serves, and every digest
  # must match. Every other check in this file looks at what a runner
  # built; this is the only one that looks at what was shipped. It found
  # that every release before v8.00-qt.4 carries a manifest naming two
  # .deb files the release does not serve -- those tags are skipped by
  # name inside the script, and anything newer is asserted.
  #
  # Only when dispatched by hand. Called from release.yml this would
  # verify the PREVIOUS release, which is true but not what anyone
  # dispatching a release wants gated on, and the one being cut does not
  # exist yet. The live repository check is here for the same reason:
  # both answer "did the last release land", and that is a question for
  # afterwards.
  published:
    name: The published release, as downloaded
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The newest release verifies as downloaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                  --json tagName --jq '.[0].tagName')
          [ -n "$tag" ] || { echo "no releases yet; nothing to verify"; exit 0; }
          tools/ci-verify-published-release.sh "$tag" "$GITHUB_REPOSITORY"
      # For the distributions THAT release was built for, read off its
      # asset names -- not for the matrix's current list, which the day
      # after a Fedora release lands names one nothing has been published
      # for yet. That was the first thing this job reported, correctly
      # and uselessly, on 2026-09-04.
      - name: The deployed repository serves it
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                  --json tagName --jq '.[0].tagName')
          [ -n "$tag" ] || exit 0
          dists=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                    --jq '.assets[].name' \
                  | sed -n 's/.*[~.]\(jammy\|noble\)_amd64\.deb$/\1/p; s/.*\.\(fc[0-9]*\|el[0-9]*\)\.x86_64\.rpm$/\1/p' \
                  | sort -u | paste -sd' ')
          echo "$tag was built for: $dists"
          DISTS="$dists" tools/ci-verify-live-repo.sh "${tag#v}"
        env:
          GH_TOKEN: ${{ github.token }}
