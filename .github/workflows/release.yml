# Publish a release when a v* tag is pushed -- QT_CI_PLAN.md Phase 5.
#
# GROUND RULE 3: one build definition, used by both CI and release. The
# definition is tools/package-*.sh, which ci.yml runs on every push and
# this runs again on a tag. A release cannot ship an artifact built by a
# recipe CI never exercised, which is the failure swisseph's package.yml
# exists to prevent.
#
# THE TAG IS CHECKED AGAINST THE SOURCE. astrolog.h owns szVersionFork; a
# tag that disagrees with it fails the job before anything is published.
# If they disagree, every bug report afterwards cites the wrong version
# and nothing else in the pipeline would ever notice.
#
# cancel-in-progress is FALSE here, unlike ci.yml. A half-published
# release is worse than a slow one.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist, e.g. v8.00-qt.1)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap, and it runs alone first so a mismatched tag costs seconds
  # rather than four package builds.
  version:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: tools/ci-assert-version.sh "${{ github.event.inputs.tag || github.ref_name }}"

  # Two jobs rather than one matrix with a conditional container. The
  # matrix version was written first and had two faults, both caught by
  # reading it rather than by running it: "${{ matrix.runs-on }}" parses
  # as "matrix.runs MINUS on" in GitHub's expression syntax, because a
  # hyphen is an operator there; and "container: ''" for the deb rows was
  # a trick that had never been exercised. This is the same shape ci.yml
  # has run successfully all day, which is a better thing to stake a
  # release on than a novel one.
  deb:
    name: .deb on ${{ matrix.image }}
    needs: version
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install build dependencies
        run: |
          # Force IPv4. The el9 dnf install sat for seven minutes waiting
          # out IPv6 mirror attempts, and on 2026-09-02 an apt-get on an
          # Ubuntu runner did the same for fourteen. Same disease, other
          # package manager: the runner advertises IPv6 that does not
          # route to the mirrors, and every attempt waits out its timeout.
          # Costs nothing where IPv6 works.
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev pkg-config libx11-dev dpkg-dev

      - name: Build
        run: make -j4 && make qt -j4

      # PKG_RELEASE=1 drops the "~date.sha" suffix, so this is the only
      # place that produces a bare 8.00+qt.N. A branch build sorts below
      # it, verified with dpkg --compare-versions.
      - name: Package
        run: PKG_RELEASE=1 tools/package-deb.sh out/package

      - name: Prove it installs and runs
        run: |
          tools/ci-verify-linux-package.sh out/package/astrolog_*.deb \
            ${{ matrix.image == 'ubuntu-22.04' && 'ubuntu:22.04' || 'ubuntu:24.04' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolog-deb-${{ matrix.image }}
          path: out/package/*.deb

  rpm:
    name: .rpm on ${{ matrix.release }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {release: fedora-42, image: 'fedora:42', qt: qt5-qtbase-devel}
          - {release: fedora-43, image: 'fedora:43', qt: qt5-qtbase-devel}
          # EL10 ships no Qt5 outside EPEL but does ship Qt6, and
          # Makefile.qt picks its modules from pkg-config, so only the
          # package name changes. See ci.yml for the measurement.
          - {release: el9,  image: 'quay.io/rockylinux/rockylinux:9', qt: qt5-qtbase-devel}
          - {release: el10, image: 'quay.io/rockylinux/rockylinux:10', qt: qt6-qtbase-devel}
    container: ${{ matrix.image }}
    steps:
      - name: Install build dependencies
        run: |
          # ip_resolve=4 before anything else. EL9's dependency install
          # took over seven minutes on a runner and 42 seconds locally,
          # on the same image, with the same packages -- while Fedora and
          # EL10 finished in ninety seconds. That shape is dnf trying
          # mirrors over IPv6 and waiting out a timeout on each: the
          # runner advertises IPv6 that does not route to those hosts,
          # and a laptop does not. Forcing IPv4 is the standard cure and
          # costs nothing where IPv6 works.
          echo 'ip_resolve=4' >> /etc/dnf/dnf.conf
          # Fewer mirrors tried, and the ones tried are not ranked by a
          # probe that also has to time out.
          echo 'max_parallel_downloads=8' >> /etc/dnf/dnf.conf
          dnf install -y -q dnf-plugins-core || true
          (dnf config-manager --set-enabled crb || \
           dnf config-manager --enable crb || true) 2>/dev/null
          dnf install -y -q --setopt=install_weak_deps=False \
            gcc-c++ make git rpm-build ${{ matrix.qt }} \
            libX11-devel pkgconf-pkg-config

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build
        run: make -j4 && make qt -j4

      - name: Package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          PKG_RELEASE=1 tools/package-rpm.sh out/package

      - name: Prove it installs and runs
        run: tools/ci-verify-linux-package.sh out/package/astrolog-*.rpm local

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolog-rpm-${{ matrix.release }}
          path: out/package/*.rpm

  windows:
    name: Windows package
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: |
          # Force IPv4. The el9 dnf install sat for seven minutes waiting
          # out IPv6 mirror attempts, and on 2026-09-02 an apt-get on an
          # Ubuntu runner did the same for fourteen. Same disease, other
          # package manager: the runner advertises IPv6 that does not
          # route to the mirrors, and every attempt waits out its timeout.
          # Costs nothing where IPv6 works.
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
      - run: make -f Makefile.win -j4
      - run: tools/package.sh windows out/package
      - run: tools/ci-verify-package.sh out/package/astrolog-windows
      # A .zip carries no unix modes and Windows wants none, so
      # ci-assert-archive-mode.sh does not apply here -- it guards the
      # tar-based Linux artifacts. Saying so beats a check that is
      # "|| true"-d into meaninglessness.
      - run: ( cd out/package && zip -qr astrolog-windows.zip astrolog-windows )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolog-windows
          path: out/package/astrolog-windows.zip

  # macOS ships an ad-hoc signed .app in a .dmg, and nothing more. That is
  # the whole free tier: codesign -s - costs nothing and is MANDATORY on
  # Apple Silicon, where arm64 will not execute an unsigned binary at all.
  # Notarization is what removes the Gatekeeper prompt for someone who
  # downloads through a browser, and it needs a Developer ID and a secret
  # in this repository -- ground rule 5, the one line in QT_CI_PLAN.md
  # nothing is allowed to cross.
  #
  # Phase 10 read that as "no macOS binaries" and said so for two days.
  # That conflated "cannot ship a frictionless artifact" with "cannot ship
  # one", and they are not the same: the artifact below runs perfectly
  # after a right-click -> Open, or one xattr command, or a curl download
  # that never gets quarantined in the first place. Plenty of open source
  # projects ship exactly this.
  macos:
    name: macOS .app and .dmg
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: brew install qt pkg-config
      - run: make qt -j4
      - run: tools/package-macos.sh out/macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolog-macos
          path: out/macos/*.dmg

  publish:
    name: Publish
    needs: [deb, rpm, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Eight artifacts: two .deb, four .rpm, one .zip, one .dmg. Exact,
      # not a floor -- "at least one" passes a release missing six. The
      # check is a script rather than YAML so it can be falsified without
      # cutting a release to test it, which is the one thing nobody wants
      # to do repeatedly.
      - name: There are eight artifacts, and a SHA256SUMS over them
        run: tools/ci-verify-release-dist.sh dist 8

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # --notes-file, not --generate-notes alone. The generated notes
          # are the commit list, and the one thing someone downloading the
          # .dmg needs is not in it: macOS will refuse to open the app,
          # with a dialog saying it is damaged, until Gatekeeper's
          # quarantine flag is cleared. Telling them on the page they are
          # standing on beats telling them in a README they have no reason
          # to open, and "damaged" reads as a broken binary rather than as
          # a missing $99 subscription. --generate-notes still runs; this
          # is prepended to it.
          cat > notes.md <<'NOTES'
          ### Installing

          **Linux** — `.deb` for Ubuntu 22.04/24.04, `.rpm` for Fedora 42/43
          and EL9/EL10. Or use the [signed repository](https://nrvate.github.io/Astrolog/)
          so upgrades arrive on their own.

          **Windows** — unpack the `.zip` and run. Statically linked.

          **macOS** — the app is ad-hoc signed but not *notarized*, so a
          download through a browser is quarantined and macOS says it is
          damaged. It is not. Either right-click the app and choose
          **Open**, or run once:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Astrolog.app
          ```

          A download fetched with `curl` is never quarantined and just runs.

          ---
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Astrolog $TAG" --notes-file notes.md \
            --generate-notes dist/*
