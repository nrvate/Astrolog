# Everything CI does, and it does it only when a release is tagged.
#
# The shape is the maintainer's, 2026-09-05: build the binaries people
# cannot build themselves -- Windows and macOS -- and leave Linux to
# "install these packages, then make", which tools/build-check.sh proves
# on twelve distributions. There is no push lane. The suite, the audits,
# the sanitizer sweeps, the differentials and the warning audit are all
# still here as scripts and are run by hand; what runs automatically is
# this, on a tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist and match astrolog.h)'
        required: true
        type: string
      # A dispatch with this off builds and tests everything and stops
      # short of the release. Without it, the only way to find out
      # whether this workflow works is to publish -- which is how a
      # release workflow comes to be tested for the first time by the
      # release that needed it.
      publish:
        description: 'Publish the release. Off for a dry run.'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap and first: a tag that disagrees with szVersionFork means every
  # bug report afterwards cites the wrong version.
  version:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: tools/ci-assert-version.sh "${{ github.event.inputs.tag || github.ref_name }}"

  # The tree itself, once, before anything is shipped -- and through the
  # same command a developer runs before committing, so the release
  # cannot check less than they do: generated tables, ten audits, both
  # binaries, the suite, and the assertion scripts' self-test. It is the
  # only thing standing between a bad commit and three published
  # artifacts.
  linux:
    name: Linux check
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # mingw as well as Qt, so "make check" builds the Win32 oracle here
      # rather than skipping it. That build compiles nowhere else now,
      # and it went 62 commits without compiling the last time nothing
      # watched it -- while three work log items listed "Windows builds"
      # among their nets. About 30 s of apt for 40 s of compile.
      - name: Dependencies
        run: tools/ci-deps.sh qtbase5-dev pkg-config libx11-dev g++-mingw-w64-x86-64
      - name: make check
        env:
          SELFTEST_ONLINE: "1"
          GH_TOKEN: ${{ github.token }}
        run: make check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: linux-suite-log
          path: /tmp/check-suite.log
          if-no-files-found: ignore
          retention-days: 14

  # What moved since the previous release, as a REPORT rather than a
  # gate. The four behavioural matrices -- chart, switch, influence,
  # graphics -- diffed against the previous tag, in the one place left
  # that runs anything: between releases nothing compares this program's
  # output to anything, which is the real cost of a tag-only CI and is
  # worth at least seeing at the moment a release is cut.
  #
  # Not a gate on purpose. Over a whole release span most movement is
  # intended, and a check that fails every release is a check nobody
  # reads. It lands in the run summary; read it before announcing.
  differential:
    name: What moved since the last release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Dependencies
        run: tools/ci-deps.sh libx11-dev
      - name: Against the previous release tag
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          base=$(git describe --tags --abbrev=0 "$REF^" 2>/dev/null || true)
          [ -n "$base" ] || { echo "no earlier tag to compare against"; exit 0; }
          echo "### Behaviour against $base" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          DIFFERENTIAL_REPORT=1 tools/ci-differential.sh "$base" out/diff \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-differential
          path: out/diff
          if-no-files-found: ignore
          retention-days: 30

  windows:
    name: Windows
    needs: version
    uses: ./.github/workflows/windows-qt.yml
    with:
      package: true

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      QT_VERSION: "6.8.3"
      # Without it clang records the host's version as the binary's
      # minimum and the .dmg claims a macOS nobody has yet.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: brew install pkg-config
      - name: Cached Qt
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0, Node 24
        with:
          path: ~/Qt
          key: qt-mac-${{ env.QT_VERSION }}-clang_64-qtbase-qttools-aqt3.3.0-nodsym
      - name: Qt ${{ env.QT_VERSION }}, pinned
        run: tools/ci-macos-qt.sh "$QT_VERSION" "$HOME/Qt" >> "$GITHUB_ENV"
      # "shell: bash" is bash -eo pipefail; the default -e reports tee's
      # status, and a failed make read as a green step.
      - name: Build
        shell: bash
        run: make qt -j4 2>&1 | tee build.log && make qt-test -j4 2>&1 | tee -a build.log
      - name: No clang warnings in our own sources
        run: tools/ci-assert-clang-clean.sh build.log 300
      - name: The suite
        env:
          ASTROLOG_QT_EPHEM: minimal
        run: tools/ci-run-suite.sh 420 suite.log -Yi1 ephem
      - name: Build the .app and .dmg
        run: tools/package-macos.sh out/macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolog-macos
          path: out/macos/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: macos-suite-log
          path: suite.log
          retention-days: 14

  publish:
    name: Publish
    needs: [linux, windows, macos]
    # A tag always publishes; a dispatch only when asked.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Only the shipped artifacts carry the "astrolog-" prefix; the logs
      # and screenshots do not, so this pattern leaves them behind.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: astrolog-*
          merge-multiple: true
      # Three: the Windows zip, the Windows installer, the macOS .dmg.
      # Exact, not a floor -- a release missing one looks complete.
      - name: Exactly three artifacts, and a SHA256SUMS over them
        run: tools/ci-verify-release-dist.sh dist 3
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Astrolog $TAG" --notes-file tools/release-notes.md \
            --generate-notes dist/*

  # The last mile, and the only check that looks at what a user actually
  # gets: download every published asset, require the manifest to name
  # exactly them, and require every digest to match. It can only run
  # after publication, so a failure means "published and wrong" -- which
  # is precisely the thing worth being told.
  published:
    name: The release, as downloaded
    needs: publish
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci-verify-published-release.sh "${{ github.event.inputs.tag || github.ref_name }}"

  retire:
    name: Retire the releases before the last two
    needs: publish
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: tools/prune-releases.sh 2
