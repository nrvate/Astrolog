# Everything CI does, and it does it only when a release is tagged.
#
# The shape is the maintainer's, 2026-09-05: build the binaries people
# cannot build themselves -- Windows and macOS -- and leave Linux to
# "install these packages, then make", which tools/build-check.sh proves
# on twelve distributions. There is no push lane. The suite, the audits,
# the sanitizer sweeps, the differentials and the warning audit are all
# still here as scripts and are run by hand; what runs automatically is
# this, on a tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist and match astrolog.h)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap and first: a tag that disagrees with szVersionFork means every
  # bug report afterwards cites the wrong version.
  version:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: tools/ci-assert-version.sh "${{ github.event.inputs.tag || github.ref_name }}"

  # The tree itself, once, before anything is shipped: both Linux
  # binaries and the whole suite. Two minutes, and it is the only thing
  # standing between a bad commit and three published artifacts.
  linux:
    name: Linux build + suite
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Dependencies
        run: tools/ci-deps.sh qtbase5-dev pkg-config libx11-dev
      - run: make -j4 && make qt-test -j4
      - name: The suite
        env:
          ASTROLOG_QT_EPHEM: minimal
        run: tools/ci-run-suite.sh 600 suite.log -Yi1 ephem
      - name: Every assertion script refuses what it must
        run: tools/ci-selftest.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: linux-suite-log
          path: suite.log
          retention-days: 14

  windows:
    name: Windows
    needs: version
    uses: ./.github/workflows/windows-qt.yml
    with:
      package: true

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      QT_VERSION: "6.8.3"
      # Without it clang records the host's version as the binary's
      # minimum and the .dmg claims a macOS nobody has yet.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: brew install pkg-config
      - name: Cached Qt
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0, Node 24
        with:
          path: ~/Qt
          key: qt-mac-${{ env.QT_VERSION }}-clang_64-qtbase-qttools-aqt3.3.0-nodsym
      - name: Qt ${{ env.QT_VERSION }}, pinned
        run: tools/ci-macos-qt.sh "$QT_VERSION" "$HOME/Qt" >> "$GITHUB_ENV"
      # "shell: bash" is bash -eo pipefail; the default -e reports tee's
      # status, and a failed make read as a green step.
      - name: Build
        shell: bash
        run: make qt -j4 2>&1 | tee build.log && make qt-test -j4 2>&1 | tee -a build.log
      - name: No clang warnings in our own sources
        run: tools/ci-assert-clang-clean.sh build.log 300
      - name: The suite
        env:
          ASTROLOG_QT_EPHEM: minimal
        run: tools/ci-run-suite.sh 420 suite.log -Yi1 ephem
      - name: Build the .app and .dmg
        run: tools/package-macos.sh out/macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolog-macos
          path: out/macos/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: macos-suite-log
          path: suite.log
          retention-days: 14

  publish:
    name: Publish
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Only the shipped artifacts carry the "astrolog-" prefix; the logs
      # and screenshots do not, so this pattern leaves them behind.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: astrolog-*
          merge-multiple: true
      # Three: the Windows zip, the Windows installer, the macOS .dmg.
      # Exact, not a floor -- a release missing one looks complete.
      - name: Exactly three artifacts, and a SHA256SUMS over them
        run: tools/ci-verify-release-dist.sh dist 3
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Astrolog $TAG" --notes-file tools/release-notes.md \
            --generate-notes dist/*

  retire:
    name: Retire the releases before the last two
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: tools/prune-releases.sh 2
