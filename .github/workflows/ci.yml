# Continuous integration for the Qt/Linux fork of Astrolog.
#
# WHAT THIS IS FOR, in one incident: "make -f Makefile.win" had not
# compiled since 2026-08-29 -- 62 commits -- while three work log items
# listed "Windows builds" among their nets. The oracle this fork measures
# itself against was dead, and the error was "Error 1", which the checks
# in use at the time did not match. One job that cross-compiles it on
# every push would have caught that on the first one. That is this file.
#
# THE PLAN. QT_CI_PLAN.md is the working document: what each job is for,
# how to know it worked, and -- the part this project cares about most --
# how to prove it is not vacuous. Read its ground rules before adding a
# job here. The two that bite hardest:
#
#   1. Every job is falsified once, deliberately, before it is trusted.
#      Break the thing it claims to check, watch it go red, put it back,
#      and write what happened in the work log. A green check mark is a
#      very convincing way to display "I did nothing".
#   2. Never pipe a build into anything that swallows its exit status
#      (| tee, || true, set +e). "run:" fails on non-zero exit, and that
#      is the whole mechanism.
#
# AND ONE RULE THIS FILE KEEPS: CI adds no logic. Every step is either a
# package install, a make invocation, or one committed script from
# tools/. Nothing is checked here that cannot be checked identically on a
# developer's machine in seconds -- which is what makes rule 1 affordable.
#
# Third-party actions are pinned to a commit SHA, not a tag: a tag is a
# mutable dependency, and this repository's whole subject is checks that
# rot without saying so.
#
# TRIGGERS (QT_CI_PLAN.md item 0.2). Work happens on "qt", not "master",
# and it happens as direct pushes -- there are no merge commits on the
# branch and never have been. So "push" is the trigger that actually
# fires today. "pull_request" is listed because it costs nothing and
# covers the day one is opened; note that the two events build different
# commits (pull_request builds refs/pull/N/merge, push builds what
# landed), so a branch listed under both runs everything twice. That is
# why only "qt" and "master" are listed under push and no branch filter
# is given for pull_request.

name: CI

on:
  pull_request:
  push:
    branches: [qt, master]
  workflow_dispatch:

# Item 0.3. One run per branch; a newer push makes an older run pointless.
# Release workflows will opt out of this -- a half-published release is
# worse than a slow one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Ground rule 5: no workflow gets more than read access until the release
# phase, which is the only one that needs anything else.
permissions:
  contents: read

jobs:
  # Item 1.1 and 1.2, plus the WCLI build from 1.3b. The single
  # highest-value job in the plan: if nothing else is ever done, do this.
  windows:
    name: Windows builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the cross toolchain
        run: tools/ci-deps.sh g++-mingw-w64-x86-64
      # 1.1. The oracle. wdriver.cpp and wdialog.cpp are compiled by no
      # other makefile in the tree, so this job is the only thing in
      # existence that diagnoses them.
      - name: Build astrolog.exe
        run: make -f Makefile.win

      - name: Assert astrolog.exe is actually new
        run: tools/ci-assert-fresh.sh astrolog.exe

      # 1.3b. The console Windows build: the same shared core compiled by
      # the same toolchain, entering at main() rather than WinMain, so it
      # can be driven non-interactively under Wine. It was compiled by
      # nothing at all until 2026-09-02, which is the exact failure this
      # job exists to prevent -- so it is built here from the day it
      # started existing rather than left to rot the way Astrolog.vcxproj
      # did. Running it under Wine is item 6.4b and belongs in the slow
      # lane; this step only proves it still compiles and links.
      - name: Build astrolog-wcli.exe
        run: make -f Makefile.wcli

      - name: Assert astrolog-wcli.exe is actually new
        run: tools/ci-assert-fresh.sh astrolog-wcli.exe

  # Phase 2. The Qt build and its suite -- the port itself, and the 3561
  # assertions that are this project's main net.
  qt:
    name: Qt5 build + suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Qt5
        run: tools/ci-deps.sh qtbase5-dev pkg-config
      - name: Build both Qt binaries
        run: make qt -j4 && make qt-test -j4

      # The Qt binary is fortified too, and only the console one was ever
      # checked. Both are shipped -- every .deb and .rpm carries both, with
      # a wrapper for each on PATH -- so a flag change that dropped
      # _FORTIFY_SOURCE from the GUI build would have gone unnoticed.
      # Measured: astrolog-qt imports 11 *_chk symbols where astrolog
      # imports 10, so a floor of 10 fits both without pinning either.
      #
      # Here rather than beside the console check, because that one runs in
      # the audits job, which builds only ./astrolog -- the check would
      # have failed on a missing file rather than on anything real.
      - name: The Qt build still has _FORTIFY_SOURCE
        run: tools/ci-assert-fortify.sh astrolog-qt 10

      # ASTROLOG_QT_EPHEM=minimal declares which ephemeris the run is
      # supposed to have. /swe -- the maintainer's 887,000-file NAS mount
      # -- will never exist on a runner; until 2026-09-03 the bundled set
      # resolved 19 of 39 bodies and this mode asserted exactly that, so
      # the thinner run declared itself instead of hiding in a pass count.
      # The bundled set resolves all 39 now and both modes assert 39; the
      # declaration stays so a thinned ephem/ fails loudly. See
      # QT_CI_PLAN.md items 2.0 and 2.3.
      #
      # "-Yi1 ephem", never "-i astrolog.as": the -i form runs zero tests
      # and exits 0, which this plan specified for two drafts before
      # anyone ran it.
      #
      # Through tools/ci-run-suite.sh -- the watchdog, process group and
      # pty the macOS job learned the hard way, one script for every
      # platform -- with the whole log kept when it fails.
      - name: Run the suite against the bundled ephemeris
        env:
          ASTROLOG_QT_EPHEM: minimal
        run: tools/ci-run-suite.sh 600 suite.log -Yi1 ephem
      - name: Keep the suite log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt5-suite-log
          path: suite.log
          retention-days: 14

      # Item 6.5. Four seconds, and the check is that no two renders are
      # identical -- a blank chart matches every other blank chart, so
      # distinctness is what says the drawing code ran.
      - name: Render the graphics charts offscreen
        run: |
          QTGRAPHDIR=out/qtg ASTROLOG_QT_EPHEM=minimal \
            ./run-qt-tests.sh -Yi1 ephem
          tools/ci-assert-distinct.sh out/qtg 24

  # Phase 3. The audits: pure Python and diff, all seconds, and they cover
  # the .rc-derived layer that CLAUDE.md says hand transcription got wrong
  # "every time it was used".
  audits:
    name: Audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # line_endings_audit.py shells out to "git ls-files", so it needs a
      # real working tree -- fine under actions/checkout, and it exits 1
      # against a "git archive" extraction.
      - name: The ten standing audits
        run: |
          python3 tools/rc_audit.py
          python3 tools/rc_mnemonic_audit.py
          python3 tools/rc_field_audit.py
          python3 tools/rc_lookup_audit.py
          python3 tools/defaults_audit.py
          python3 tools/registry_audit.py
          python3 tools/line_endings_audit.py
          python3 tools/fixture_coverage_audit.py
          python3 tools/vcxproj_audit.py
          python3 tools/qt_srcs_audit.py

      # The pre-commit form. The plain ">" form overwrites the committed
      # file and must never appear in a workflow.
      - name: The three generated tables are in sync
        run: |
          python3 tools/rc2qt.py astrolog.rc   | diff - qtrcdlg.h
          python3 tools/rc_accel.py astrolog.rc | diff - qtrcaccel.h
          python3 tools/rc_cmd.py astrolog.rc resource.h | diff - qtrccmd.h

      - name: Install X11 headers for the console build
        run: tools/ci-deps.sh libx11-dev
      # The console build is the one that compiles the X11 backend at all,
      # and it is what the round trip and every differential matrix drive.
      # The target is named because a plain "make" builds the Qt port too,
      # and this job installs no Qt.
      - name: Build the console binary
        run: make astrolog -j4

      - name: Assert it is actually new
        run: tools/ci-assert-fresh.sh astrolog

      - name: The settings round trip
        run: tools/settings-round-trip.sh

      # Item 3.4. Asserts the mechanism is present, not that any
      # particular overflow is caught: the -O0 sanitizer build has
      # _FORTIFY_SOURCE inactive, which is why work log item 142 survived
      # a full ASan sweep and 17 gdb runs. This guards that the ordinary
      # builds keep the net the sweep cannot have.
      - name: The shipped builds still have fortify
        run: tools/ci-assert-fortify.sh astrolog 10

  # The compiler is a harness too, and since 2026-09-04 (night) it is a
  # PUSH-LANE one. tools/warnings.txt, the ledger of what -Wall says
  # across every build, is empty; a new warning in the fork's own code
  # is a thing to fix, and learning about it at the next tag -- where
  # this job lived until now, in the slow lane -- inverted that message
  # by a week. About three minutes, under the Windows build's five, so
  # it costs a job and no wall time. Every build, both Qts, on whatever
  # compiler ubuntu-latest carries: the runner pin that once kept 113
  # known lines stable across g++ versions went with the lines. The
  # ledger's own header says the rest; the vendored Swiss sources are
  # exempted in Makefile.srcs.
  warnings:
    name: Compiler warnings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install every toolchain the audit compiles with
        run: tools/ci-deps.sh qtbase5-dev qt6-base-dev pkg-config libx11-dev g++-mingw-w64-x86-64
      - name: Every build, every warning diffed against an empty ledger
        run: QT6_PKGCONFIG= tools/warning_audit.py

  # Q8, decided 2026-09-02: Qt6 is "known to work, kept alive by CI".
  #
  # Qt5 remains the supported and packaged configuration; nothing here
  # changes that. What this job buys is that the Qt6 build cannot rot
  # silently, which is what has happened to every other configuration in
  # this tree that nothing compiles -- Astrolog.vcxproj has been one
  # <ClCompile> line short since 2022, and WCLI was compiled by nothing at
  # all from the day it was written until 2026-09-02. Qt6 arrived on
  # 2026-09-01 and was in that category by the following morning.
  #
  # It must NOT install qtbase5-dev. Makefile.qt picks its module names
  # from "pkg-config --exists Qt6Widgets", so a runner with both installed
  # would build the "Qt5" job against Qt6 and nobody would be told.
  #
  # QT6_PKGCONFIG and QT6_LIBDIR are emptied because both exist for a
  # hand-installed Qt6 -- the maintainer's is under /usr/local/qt6, off
  # pkg-config's path and off the runtime linker's. A distribution's own
  # Qt6 needs neither.
  qt6:
    name: Qt6 build + suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Qt6 (and deliberately not Qt5)
        run: tools/ci-deps.sh qt6-base-dev pkg-config
      - name: Build against Qt6
        run: |
          make qt6 -j4 QT6_PKGCONFIG= QT6_LIBDIR=
          make qt6-test -j4 QT6_PKGCONFIG= QT6_LIBDIR=

      - name: Assert the Qt6 binaries are new
        run: |
          tools/ci-assert-fresh.sh astrolog-qt6
          tools/ci-assert-fresh.sh astrolog-qt6-test

      - name: Run the suite against Qt6
        env:
          QTTESTBIN: ./astrolog-qt6-test
          ASTROLOG_QT_EPHEM: minimal
        run: tools/ci-run-suite.sh 600 suite.log -Yi1 ephem
      - name: Keep the suite log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt6-suite-log
          path: suite.log
          retention-days: 14

  # Phase 4's smallest piece, and the other "does the shipped thing work"
  # surface. "make install" puts two wrappers on PATH and leaves the data
  # in the checkout, so the tree has to stay put -- which means the thing
  # to test is that the installed wrapper finds its ephemeris from an
  # unrelated working directory. Assert Chiron, never the Sun: Astrolog
  # falls back to the Moshier formulas silently, so the Sun reads
  # 24Gem07'46" with the ephemeris files entirely absent, and a
  # Sun-position check passes on a broken install (item 4.5).
  install:
    name: System install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Qt5 and X11 headers
        run: tools/ci-deps.sh qtbase5-dev pkg-config libx11-dev desktop-file-utils
      - name: Build and install into a scratch prefix
        run: |
          make -j4 && make qt -j4
          make install PREFIX="$HOME/.local"

      - name: Run the installed wrapper from an unrelated directory
        run: tools/ci-assert-installed.sh "$HOME/.local/bin/astrolog"

      # A malformed .desktop file does not error, it simply never appears
      # in the menu -- invisible until somebody says "I installed it and
      # there's nothing in my applications list". Same for an Icon= naming
      # something nobody installed: the entry shows a blank square. Both
      # are generated in two places, the Makefile and package-stage.sh, so
      # they can drift from each other as well as from the spec.
      - name: The desktop entry is valid and its icon exists
        run: tools/ci-assert-desktop.sh "$HOME/.local"

      # "make uninstall" is documented in README.md and CLAUDE.md and had
      # never been run by anything. A target nobody executes is the same
      # category as a configuration nobody compiles, and this repository
      # has found three of those broken. It checks the removal is complete
      # -- a dangling wrapper on PATH is a program that says "No such file
      # or directory" months later -- and no wider than it should be: the
      # directories are shared with every other application, and removing
      # ~/.local/share/applications shows up as somebody else's missing
      # menu entry.
      - name: And uninstall removes exactly what it installed
        run: |
          make uninstall PREFIX="$HOME/.local"
          tools/ci-assert-uninstalled.sh "$HOME/.local"

      # Every tools/ci-*.sh script, fed input it must refuse and input it
      # must accept. Here because this job has both binaries, so the
      # install round trip runs for real; and online, so the gh-backed
      # case runs too. tools/ci-selftest.sh says why it exists.
      - name: Every assertion script refuses what it must
        env:
          SELFTEST_ONLINE: "1"
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: tools/ci-selftest.sh

  # Phase 7. The differentials -- the phase that makes CI strictly better
  # than the local workflow rather than merely more reliable. Building a
  # baseline by hand is what QT_TESTING.md tells a developer to do; here
  # the base commit is already fetched, so the harness is cheaper to run
  # than to skip, and a harness that is cheaper to run gets run.
  #
  # fetch-depth: 0 rather than 2. actions/checkout clones one commit by
  # default, so even HEAD~1 is absent; depth 2 covers a single-commit push
  # and nothing else, and github.event.before can be any distance back.
  # The whole repository is 14.47 MiB, so full history is the cheap answer
  # to a class of failure rather than a cost.
  #
  # The base SHA differs by event, and picking the wrong one is silent:
  # pull_request builds refs/pull/N/merge and wants the PR base, push
  # wants what was there before. On the first push to a new branch
  # github.event.before is all zeros, and there is nothing to diff against
  # -- the job says so and passes rather than inventing a baseline.
  # ALL FOUR matrices, since 2026-09-05. The switch matrix was left out
  # from 2026-09-02: 1,058 invocations of seven processes each took this
  # job past 25 minutes on a runner (the chart matrix and both builds
  # took 26 seconds), so the switch surface -- the settings writer and
  # the help text -- was diffed by no lane at all. tools/switch-matrix.sh
  # runs four workers of four processes now, byte-identical output, 40 s
  # to 16 s on a workstation; this job's duration is the runner's number.
  differential:
    name: Behaviour vs base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tree with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install X11 headers
        run: tools/ci-deps.sh libx11-dev
      # Fast, and it belongs here rather than with the pure-Python audits
      # because it needs a built binary and renders 227 bitmaps.
      #
      # It answers a question the differential in the next step cannot: an
      # option that changes nothing still diffs to zero between two builds,
      # which is indistinguishable from a passing differential. "-XE 1 20"
      # sat in the matrix that way from the day it was written.
      - name: No inert options in the graphics matrix
        run: make astrolog -j4 && python3 tools/inert_option_audit.py

      - name: Diff all four matrices against the base commit
        env:
          BASE_PUSH: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_PR:-$BASE_PUSH}"
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "No base commit for this event -- a new branch or the"
              echo "first push. Nothing to diff against; not inventing one."
              exit 0 ;;
          esac
          tools/ci-differential.sh "$base" out/diff

      # The diffs are the report. Uploaded whether or not the step above
      # failed, because a red differential is exactly when someone wants
      # to read them.
      - name: Keep the diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-diffs
          path: out/diff/*.diff
          if-no-files-found: ignore

  # Item 4.3, and since 2026-09-04 the WINDOWS PACKAGE IS THE QT BUILD.
  # A reusable workflow, because release.yml calls the same one: ground
  # rule 3, one build definition used by both CI and release. It compiles
  # the port with MSVC on a Windows runner, runs the 3812-assertion suite
  # there, starts the staged program with its real platform plugin and
  # requires a window, then zips it and builds the NSIS installer on
  # Linux and installs and uninstalls that under Wine. The file says why
  # each half runs where it does.
  #
  # The Win32 build is still compiled above and still driven under Wine
  # by the slow lane, because it is the behavioural oracle -- it is no
  # longer what ships.
  # Does this push touch what the Windows zip and installer are made
  # from? tools/ci-touched.sh answers, and answers "true" whenever it
  # cannot tell (no base, a base not in the clone), because a check
  # skipped for lack of an answer is the worst outcome of the three.
  # Fifteen seconds here to decide whether to spend ninety.
  windows-packaging:
    name: Windows packaging inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      touched: ${{ steps.t.outputs.touched }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: t
        env:
          BASE_PUSH: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "touched=$(tools/ci-touched.sh "${BASE_PR:-$BASE_PUSH}" \
            tools/package-windows-qt.py tools/package-windows-installer.sh \
            tools/astrolog.nsi tools/ci-verify-package.sh tools/ci-verify-zip.sh \
            tools/ci-verify-windows-installer.sh tools/qt_windows_dist_audit.py \
            .github/workflows/windows-qt.yml ephem font)" >> "$GITHUB_OUTPUT"
      - run: echo "packaging touched -- ${{ steps.t.outputs.touched }}"

  windows-qt:
    name: Windows package
    needs: windows-packaging
    uses: ./.github/workflows/windows-qt.yml
    with:
      package: ${{ needs.windows-packaging.outputs.touched == 'true' }}

  # Item 4.2, the .deb. Built INSIDE ubuntu:<version> with
  # tools/build-in-container.sh, not ON a runner image: the rows come
  # from tools/distros.py, which asks Launchpad for every LTS in standard
  # support, and a Docker image exists the day a release does where a
  # runner image may never (Ubuntu 26.04 shipped in April 2026; there was
  # no ubuntu-26.04 runner in September). Docker runs from the host, so
  # the strong check stays: the package is then installed into a FRESH
  # container, Qt resolved from the distribution's own repositories, and
  # asked for Chiron -- never the Sun, which reads correctly with no
  # ephemeris at all.
  # The four package jobs -- .deb and .rpm, here and in release.yml --
  # are one reusable workflow since 2026-09-05; see its header. A PUSH
  # builds the newest row of each family ("--push"), which proves the
  # recipe; a RELEASE builds every row, and a row-specific break fails
  # the release before anything is published.
  deb:
    name: Linux
    needs: matrix
    uses: ./.github/workflows/linux-package.yml
    with:
      kind: deb
      matrix: ${{ needs.matrix.outputs.deb }}


  # THE DISTRIBUTION LIST IS NOT HERE. tools/distros.py is the one place
  # it is defined; this job asks it. Fedora has no LTS -- each release is
  # supported about thirteen months -- and "the last two" written here
  # by hand said 42 and 43 for four months after 42 had stopped receiving
  # updates and 44 had shipped. The script asks Fedora's own release
  # service (Bodhi, state=current, the newest two) and Ubuntu's
  # (Launchpad, every LTS in standard support); EL9 and EL10 are written
  # in the script, since Enterprise Linux moves every three years and is
  # bounded by nothing an API should decide.
  #
  # THE ROWS USED COME FROM tools/distros.json, THE COMMITTED SNAPSHOT --
  # so a build is a function of its commit and a matrix cannot change
  # under an empty diff. This job reads the snapshot and nothing else;
  # the live services are asked by the "drift" job below, which is
  # deliberately NOT in this job's path.
  #
  # The Qt package differs by row, and it is not a detail. Measured
  # 2026-09-02 with only base + CRB enabled, no third-party repo: EL9 has
  # qt5-qtbase-devel and no Qt6; EL10 has qt6-qtbase-devel and no Qt5
  # (EPEL has it, but then every user needs EPEL for a runtime
  # dependency). Fedora has both and builds against Qt6, because Fedora
  # will drop Qt5 before EL9 does and a row that selects its release
  # automatically should not depend on a library that release is on its
  # way to removing. Makefile.qt picks its module names from pkg-config,
  # so nothing but the package name changes. Verified 2026-09-03 in a
  # fedora:44 container: links libQt6Core, packages, installs, computes
  # Chiron.
  matrix:
    name: Which distributions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rpm: ${{ steps.rpm.outputs.matrix }}
      deb: ${{ steps.deb.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # ONE ROW PER FAMILY ON A PUSH -- the newest Fedora and the newest
      # Ubuntu LTS -- and every row on a release. The rows differ only in
      # image and Qt package name; one of each proves the recipe (stage,
      # package, wrapper layout, clean-container install) on every change,
      # and a row-specific break fails the release before anything is
      # published. Seven package jobs per push had become forty percent of
      # this lane's job time once the rpm rows verified in clean
      # containers. tools/distros.py says the rest.
      - id: rpm
        run: echo "matrix=$(python3 tools/distros.py rpm --push)" >> "$GITHUB_OUTPUT"
      - id: deb
        run: echo "matrix=$(python3 tools/distros.py deb --push)" >> "$GITHUB_OUTPUT"

  # Does the snapshot still match what Fedora and Ubuntu answer today?
  # The first push after a release ships or ages out goes red HERE, and
  # only here, naming the row and "tools/distros.py --update", the one
  # command that rewrites the snapshot for a commit somebody reads.
  #
  # A job of its own, on purpose. The first version ran this inside the
  # matrix job, which every package job needs, so a Fedora release would
  # have turned an unrelated push red AND skipped all seven package jobs
  # -- the shape this repository already rejected once for the nightly
  # differential: failing an aggregate punishes whoever pushed last.
  # Here the packages still build from the committed rows, the run still
  # shows a red X, and the red says exactly what to do. release.yml keeps
  # the same check as a hard gate, where a release should not proceed on
  # rows its history does not carry.
  drift:
    name: The distribution snapshot is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # --warn, so a stale snapshot annotates this push instead of
      # reddening it. The snapshot going stale is a calendar event: it
      # happens when Fedora ships or an Ubuntu LTS ages out, and the push
      # that catches it has nothing to do with it. release.yml's matrix
      # job runs the same check WITHOUT --warn, so a stale snapshot still
      # stops a release before anything is published -- which is where
      # the answer has to be right.
      - run: python3 tools/distros.py check --warn

  rpm:
    name: Linux
    needs: matrix
    uses: ./.github/workflows/linux-package.yml
    with:
      kind: rpm
      matrix: ${{ needs.matrix.outputs.rpm }}


