# Continuous integration for the Qt/Linux fork of Astrolog.
#
# WHAT THIS IS FOR, in one incident: "make -f Makefile.win" had not
# compiled since 2026-08-29 -- 62 commits -- while three work log items
# listed "Windows builds" among their nets. The oracle this fork measures
# itself against was dead, and the error was "Error 1", which the checks
# in use at the time did not match. One job that cross-compiles it on
# every push would have caught that on the first one. That is this file.
#
# THE PLAN. QT_CI_PLAN.md is the working document: what each job is for,
# how to know it worked, and -- the part this project cares about most --
# how to prove it is not vacuous. Read its ground rules before adding a
# job here. The two that bite hardest:
#
#   1. Every job is falsified once, deliberately, before it is trusted.
#      Break the thing it claims to check, watch it go red, put it back,
#      and write what happened in the work log. A green check mark is a
#      very convincing way to display "I did nothing".
#   2. Never pipe a build into anything that swallows its exit status
#      (| tee, || true, set +e). "run:" fails on non-zero exit, and that
#      is the whole mechanism.
#
# AND ONE RULE THIS FILE KEEPS: CI adds no logic. Every step is either a
# package install, a make invocation, or one committed script from
# tools/. Nothing is checked here that cannot be checked identically on a
# developer's machine in seconds -- which is what makes rule 1 affordable.
#
# Third-party actions are pinned to a commit SHA, not a tag: a tag is a
# mutable dependency, and this repository's whole subject is checks that
# rot without saying so.
#
# TRIGGERS (QT_CI_PLAN.md item 0.2). Work happens on "qt", not "master",
# and it happens as direct pushes -- there are no merge commits on the
# branch and never have been. So "push" is the trigger that actually
# fires today. "pull_request" is listed because it costs nothing and
# covers the day one is opened; note that the two events build different
# commits (pull_request builds refs/pull/N/merge, push builds what
# landed), so a branch listed under both runs everything twice. That is
# why only "qt" and "master" are listed under push and no branch filter
# is given for pull_request.

name: CI

on:
  pull_request:
  push:
    branches: [qt, master]
  workflow_dispatch:

# Item 0.3. One run per branch; a newer push makes an older run pointless.
# Release workflows will opt out of this -- a half-published release is
# worse than a slow one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Ground rule 5: no workflow gets more than read access until the release
# phase, which is the only one that needs anything else.
permissions:
  contents: read

jobs:
  # Item 1.1 and 1.2, plus the WCLI build from 1.3b. The single
  # highest-value job in the plan: if nothing else is ever done, do this.
  windows:
    name: Windows builds (mingw-w64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      # 1.1. The oracle. wdriver.cpp and wdialog.cpp are compiled by no
      # other makefile in the tree, so this job is the only thing in
      # existence that diagnoses them.
      - name: Build astrolog.exe
        run: make -f Makefile.win

      - name: Assert astrolog.exe is actually new
        run: tools/ci-assert-fresh.sh astrolog.exe

      # 1.3b. The console Windows build: the same shared core compiled by
      # the same toolchain, entering at main() rather than WinMain, so it
      # can be driven non-interactively under Wine. It was compiled by
      # nothing at all until 2026-09-02, which is the exact failure this
      # job exists to prevent -- so it is built here from the day it
      # started existing rather than left to rot the way Astrolog.vcxproj
      # did. Running it under Wine is item 6.4b and belongs in the slow
      # lane; this step only proves it still compiles and links.
      - name: Build astrolog-wcli.exe
        run: make -f Makefile.wcli

      - name: Assert astrolog-wcli.exe is actually new
        run: tools/ci-assert-fresh.sh astrolog-wcli.exe

  # Phase 2. The Qt build and its suite -- the port itself, and the 3561
  # assertions that are this project's main net.
  qt:
    name: Qt5 build and suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Qt5
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev pkg-config

      - name: Build both Qt binaries
        run: make qt -j4 && make qt-test -j4

      # ASTROLOG_QT_EPHEM=minimal is not optional here and not a
      # convenience. /swe -- the maintainer's 887,000-file NAS mount --
      # will never exist on a runner, and without the mode the suite
      # resolves 19 of 39 bodies instead of 39, skips 20 assertions, and
      # says so nowhere except in a pass count nobody compares. The mode
      # makes the thinner run declare itself: it asserts exactly 19, and
      # it fails if it gets 39. See QT_CI_PLAN.md items 2.0 and 2.3.
      #
      # "-Yi1 ephem", never "-i astrolog.as": the -i form runs zero tests
      # and exits 0, which this plan specified for two drafts before
      # anyone ran it.
      - name: Run the suite against the bundled ephemeris
        run: ASTROLOG_QT_EPHEM=minimal ./run-qt-tests.sh -Yi1 ephem

      # Item 6.5. Four seconds, and the check is that no two renders are
      # identical -- a blank chart matches every other blank chart, so
      # distinctness is what says the drawing code ran.
      - name: Render the graphics charts offscreen
        run: |
          QTGRAPHDIR=out/qtg ASTROLOG_QT_EPHEM=minimal \
            ./run-qt-tests.sh -Yi1 ephem
          tools/ci-assert-distinct.sh out/qtg 24

  # Phase 3. The audits: pure Python and diff, all seconds, and they cover
  # the .rc-derived layer that CLAUDE.md says hand transcription got wrong
  # "every time it was used".
  audits:
    name: Audits and generated tables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # line_endings_audit.py shells out to "git ls-files", so it needs a
      # real working tree -- fine under actions/checkout, and it exits 1
      # against a "git archive" extraction.
      - name: The eight standing audits
        run: |
          python3 tools/rc_audit.py
          python3 tools/rc_mnemonic_audit.py
          python3 tools/rc_field_audit.py
          python3 tools/rc_lookup_audit.py
          python3 tools/defaults_audit.py
          python3 tools/registry_audit.py
          python3 tools/line_endings_audit.py
          python3 tools/fixture_coverage_audit.py

      # The pre-commit form. The plain ">" form overwrites the committed
      # file and must never appear in a workflow.
      - name: The three generated tables are in sync
        run: |
          python3 tools/rc2qt.py astrolog.rc   | diff - qtrcdlg.h
          python3 tools/rc_accel.py astrolog.rc | diff - qtrcaccel.h
          python3 tools/rc_cmd.py astrolog.rc resource.h | diff - qtrccmd.h

      - name: Install X11 headers for the console build
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      # The console build is the one that compiles the X11 backend at all,
      # and it is what the round trip and every differential matrix drive.
      - name: Build the console binary
        run: make -j4

      - name: Assert it is actually new
        run: tools/ci-assert-fresh.sh astrolog

      - name: The settings round trip
        run: tools/settings-round-trip.sh

      # Item 3.4. Asserts the mechanism is present, not that any
      # particular overflow is caught: the -O0 sanitizer build has
      # _FORTIFY_SOURCE inactive, which is why work log item 142 survived
      # a full ASan sweep and 17 gdb runs. This guards that the ordinary
      # builds keep the net the sweep cannot have.
      - name: The shipped builds still have fortify
        run: tools/ci-assert-fortify.sh astrolog 10

  # Q8, decided 2026-09-02: Qt6 is "known to work, kept alive by CI".
  #
  # Qt5 remains the supported and packaged configuration; nothing here
  # changes that. What this job buys is that the Qt6 build cannot rot
  # silently, which is what has happened to every other configuration in
  # this tree that nothing compiles -- Astrolog.vcxproj has been one
  # <ClCompile> line short since 2022, and WCLI was compiled by nothing at
  # all from the day it was written until 2026-09-02. Qt6 arrived on
  # 2026-09-01 and was in that category by the following morning.
  #
  # It must NOT install qtbase5-dev. Makefile.qt picks its module names
  # from "pkg-config --exists Qt6Widgets", so a runner with both installed
  # would build the "Qt5" job against Qt6 and nobody would be told.
  #
  # QT6_PKGCONFIG and QT6_LIBDIR are emptied because both exist for a
  # hand-installed Qt6 -- the maintainer's is under /usr/local/qt6, off
  # pkg-config's path and off the runtime linker's. A distribution's own
  # Qt6 needs neither.
  qt6:
    name: Qt6 build and suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Qt6 (and deliberately not Qt5)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev pkg-config

      - name: Build against Qt6
        run: |
          make qt6 -j4 QT6_PKGCONFIG= QT6_LIBDIR=
          make qt6-test -j4 QT6_PKGCONFIG= QT6_LIBDIR=

      - name: Assert the Qt6 binaries are new
        run: |
          tools/ci-assert-fresh.sh astrolog-qt6
          tools/ci-assert-fresh.sh astrolog-qt6-test

      - name: Run the suite against Qt6
        run: |
          QTTESTBIN=./astrolog-qt6-test ASTROLOG_QT_EPHEM=minimal \
            ./run-qt-tests.sh -Yi1 ephem

  # Phase 4's smallest piece, and the other "does the shipped thing work"
  # surface. "make install" puts two wrappers on PATH and leaves the data
  # in the checkout, so the tree has to stay put -- which means the thing
  # to test is that the installed wrapper finds its ephemeris from an
  # unrelated working directory. Assert Chiron, never the Sun: Astrolog
  # falls back to the Moshier formulas silently, so the Sun reads
  # 24Gem07'46" with the ephemeris files entirely absent, and a
  # Sun-position check passes on a broken install (item 4.5).
  install:
    name: make install, then run it from elsewhere
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Qt5 and X11 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev pkg-config libx11-dev

      - name: Build and install into a scratch prefix
        run: |
          make -j4 && make qt -j4
          make install PREFIX="$HOME/.local"

      - name: Run the installed wrapper from an unrelated directory
        run: tools/ci-assert-installed.sh "$HOME/.local/bin/astrolog"

  # Phase 7. The differentials -- the phase that makes CI strictly better
  # than the local workflow rather than merely more reliable. Building a
  # baseline by hand is what QT_TESTING.md tells a developer to do; here
  # the base commit is already fetched, so the harness is cheaper to run
  # than to skip, and a harness that is cheaper to run gets run.
  #
  # fetch-depth: 0 rather than 2. actions/checkout clones one commit by
  # default, so even HEAD~1 is absent; depth 2 covers a single-commit push
  # and nothing else, and github.event.before can be any distance back.
  # The whole repository is 14.47 MiB, so full history is the cheap answer
  # to a class of failure rather than a cost.
  #
  # The base SHA differs by event, and picking the wrong one is silent:
  # pull_request builds refs/pull/N/merge and wants the PR base, push
  # wants what was there before. On the first push to a new branch
  # github.event.before is all zeros, and there is nothing to diff against
  # -- the job says so and passes rather than inventing a baseline.
  differential:
    name: Behavioural differential vs the base commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tree with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install X11 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Diff all four matrices against the base commit
        env:
          BASE_PUSH: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_PR:-$BASE_PUSH}"
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "No base commit for this event -- a new branch or the"
              echo "first push. Nothing to diff against; not inventing one."
              exit 0 ;;
          esac
          tools/ci-differential.sh "$base" out/diff

      # The diffs are the report. Uploaded whether or not the step above
      # failed, because a red differential is exactly when someone wants
      # to read them.
      - name: Keep the diffs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: differential-diffs
          path: out/diff/*.diff
          if-no-files-found: ignore

  # Phase 4, the Windows half. Q1 still gates the LINUX artifact -- an
  # AppImage carries ~70 MB of Qt closure, a .deb is ~8 MB and lets apt
  # resolve Qt5, a tarball is trivial but "download and run" then does not
  # work -- and that is a judgement about audience, not something to
  # settle by building whichever is easiest. The Windows one has no such
  # question: Makefile.win links fully static, so it is one .exe plus the
  # data, and Q4 settled what data (astexo.csv ships; the "Show
  # E&xoplanets" menu item reads it).
  #
  # Ground rule 3 is "one build definition, used by both CI and release".
  # swisseph reaches that with a reusable workflow; here the definition is
  # tools/package.sh, which a release workflow will call unchanged. Same
  # guarantee, and it can be run by hand.
  package:
    name: Windows package, and it verifies itself
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Build the oracle
        run: make -f Makefile.win -j4

      - name: Assemble the package
        run: tools/package.sh windows out/package

      # Presence, absence, manifest generated, manifest checked back, and
      # the manifest's line count against the file count. That last one is
      # not paranoia: a SHA256SUMS covering a fifth of a package passes
      # "sha256sum -c" perfectly.
      - name: Verify it
        run: tools/ci-verify-package.sh out/package/astrolog-windows

      # 4.6. The mode has to be read out of the archive, never off the
      # disk. It matters for the Linux package rather than this one -- a
      # .zip carries no unix modes -- but the mechanism is what rots, so
      # it is exercised here where there is something to exercise it on.
      - name: The binary is executable inside the archive
        run: |
          ( cd out/package && tar czf astrolog-windows.tar.gz astrolog-windows )
          tools/ci-assert-archive-mode.sh \
            out/package/astrolog-windows.tar.gz astrolog.exe

      - name: Keep the package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: astrolog-windows
          path: out/package/astrolog-windows.tar.gz
