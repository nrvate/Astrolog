# Publish signed apt and dnf repositories to GitHub Pages.
#
# QT_CI_PLAN.md item 4.7. Release assets make a user download a file and
# install it by hand, once per release. A repository makes it
# "apt install astrolog" and then upgrades arrive on their own, which is
# most of what packaging is for.
#
# THIS IS THE ONE WORKFLOW THAT NEEDS A SECRET, and it is a deliberate
# exception to the plan's ground rule 5. Signing is not optional: apt
# refuses an unsigned repository outright and dnf needs gpgcheck=0, which
# is a bad habit to teach a user in an install instruction. The secret is
# a passphrase-less GPG private key that signs nothing but this
# repository; it grants no access to the repository's contents and is not
# the maintainer's personal identity unless they make it so.
#
# It rebuilds from EVERY release, not just the newest, so older versions
# stay installable and "apt install astrolog=8.00+qt.1~jammy" keeps
# working.

name: Repository

# workflow_run, NOT "release: published". The release is published by
# release.yml using the repository's own GITHUB_TOKEN, and GitHub does not
# start a workflow run from an event that token created -- a deliberate
# recursion guard. So a "release: published" trigger here would never
# fire, and the repository would silently stay a release behind until
# somebody dispatched it by hand. workflow_run is not subject to that,
# because it keys off the workflow finishing rather than off the event
# the token raised.
#
# The "success" condition matters: release.yml failing means there is
# nothing new to publish, and rebuilding the repository from a partial
# release would replace a working one with a worse one.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A dispatch has no workflow_run context, so the condition has to
    # allow it through as well as a successful release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Tools
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c gnupg rpm

      # Every release, so old versions stay installable.
      # Every release that still exists -- release.yml prunes to the newest
      # two -- and only the distributions tools/distros.py names today.
      # What the filter drops is printed by name; the site serves what the
      # matrix builds and nothing it does not.
      - name: Collect the packages from every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/collect-release-packages.sh pkgs

      # The key never touches the disk outside the runner's own GNUPGHOME,
      # and the job has contents:read only.
      - name: Import the signing key
        env:
          KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "REPO_GPG_PRIVATE_KEY is not set."
            echo "An unsigned repository is not worth publishing -- see the"
            echo "header of this workflow. Add the secret, or disable this job."
            exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -p -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      # Before the build, because the build writes the install
      # instructions into index.html and needs to know the URL they will
      # be served from. Getting this order wrong makes an index page that
      # tells people to add an empty repository.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - name: Build and sign
        run: tools/make-repo.sh pkgs public "${{ steps.pages.outputs.base_url }}"

      # BEFORE deploying, not after. The first published repository built,
      # signed, and served every URL at 200 -- and could not be installed
      # from, because one suite holding every package made apt offer an
      # Ubuntu 22.04 machine the noble build. Every other check passed. The
      # only thing that would have caught it is the thing this step does:
      # install from the repository, in a container of each distribution
      # it claims to serve, and cast a chart.
      #
      # Six containers, about three minutes. It runs on a release, not on
      # every push, and a repository that cannot be installed from is
      # worse than no repository because it is advertised.
      - name: Install from it, on every distribution it serves
        run: tools/ci-verify-repo.sh public

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
