# One distribution's package: built inside that distribution's own
# container, installed in a CLEAN one, and kept.
#
# This is one workflow where there were four jobs. ci.yml and release.yml
# each carried a .deb job and an .rpm job -- the same five steps, four
# times, differing in the package kind, in PKG_RELEASE, and in how the
# artifact is uploaded. They had already drifted: the step names differed
# ("Install it in a clean container and run it" against "Prove it
# installs and runs"), and a comment about the dnf settings lived in one
# copy only. Four copies of a release-critical recipe is how one of them
# quietly stops matching the others.
#
# What is NOT here: the distribution list. tools/distros.py owns that,
# tools/distros.json is the committed snapshot every read comes from, and
# the caller passes the rows in. This workflow never asks what to build,
# only how.
name: Linux package

on:
  workflow_call:
    inputs:
      kind:
        description: 'deb or rpm -- the package format, and the file extension'
        required: true
        type: string
      matrix:
        description: 'the rows, as tools/distros.py deb|rpm prints them'
        required: true
        type: string
      release:
        description: >-
          true for a release, false for a push. Two things follow from it.
          PKG_RELEASE=1 goes into the package version, as it always did.
          And the artifact is uploaded ZIPPED, so the artifact keeps the
          name given here and release.yml's "astrolog-*" download pattern
          finds it; on a push it is uploaded as-is (archive: false), where
          the FILENAME becomes the artifact name and the download is the
          package itself rather than a zip holding one. That difference
          was already the difference between the two lanes' copies, and
          it is load-bearing in both directions.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    # The two families name their rows differently, and renaming the keys
    # would touch tools/distros.json and both repository verifiers, so
    # both spellings are resolved here instead:
    #   .deb rows: container=ubuntu:24.04, image=ubuntu-24.04
    #   .rpm rows: image=fedora:44,        release=fedora-44
    # so the docker image is "container or image" and the row's label is
    # "release or image". The artifact names come out exactly as the four
    # jobs produced them before.
    name: .${{ inputs.kind }} on ${{ matrix.release || matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      PKG_RELEASE: ${{ inputs.release && '1' || '' }}
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Docker runs from the HOST, not "container:" on the job, and that
      # is what keeps the strong check below possible: a job running
      # inside the container cannot start a second, clean one to prove
      # the package installs there. The rpm rows verified with the weak
      # "local" mode -- build dependencies already present, a wrong
      # Requires line invisible -- until they moved to this script.
      #
      # The dnf and apt settings that the inline installs used to carry
      # (IPv4 only, a bounded mirror timeout, no ranking probe, CRB
      # enabled) live in the script, with the measurements behind them.
      - name: Build both binaries and package, inside ${{ matrix.container || matrix.image }}
        run: tools/build-in-container.sh ${{ matrix.container || matrix.image }} ${{ matrix.qt }} ${{ inputs.kind }} out/package

      # A FRESH image of the same distribution, Qt resolved from its own
      # repositories, and Chiron asserted -- never the Sun, which reads
      # correctly with no ephemeris at all because Astrolog falls back to
      # Moshier in silence.
      - name: Install it in a clean container and run it
        run: tools/ci-verify-linux-package.sh out/package/*.${{ inputs.kind }} ${{ matrix.container || matrix.image }}

      - name: Keep the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: ${{ inputs.release }}
          name: astrolog-${{ inputs.kind }}-${{ matrix.release || matrix.image }}
          path: out/package/*.${{ inputs.kind }}
          if-no-files-found: error
