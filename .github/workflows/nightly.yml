# The slow lane -- QT_CI_PLAN.md Phase 6.
#
# Everything here is documented in CLAUDE.md as "pre-release rather than
# pre-commit". "Pre-release" is a promise a human keeps by remembering;
# this is where it becomes mechanical. Both jobs have a record: the
# warning audit's first run found that Makefile.win had not compiled for
# 62 commits, and the first run of each half of the sanitizer sweep found
# real out-of-bounds bugs in code that had been exercised dozens of times
# without a sanitizer behind it -- seven between them, one crashing the
# release build.
#
# A HAZARD THAT APPLIES TO THIS FILE AND NOT TO ci.yml: GitHub disables
# scheduled workflows in a repository with no activity for 60 days. The
# whole argument for a nightly is that it keeps a promise by existing, and
# on a fork that goes quiet for two months it stops existing, silently,
# leaving a green history behind it. workflow_dispatch is on both jobs so
# there is always a manual path, and "the nightly has not run lately" is a
# thing somebody has to notice.
#
# ubuntu-22.04, NOT ubuntu-latest, and the reason is specific to the
# warning audit rather than the glibc one that governs packaging:
# tools/warnings.txt is a ledger of what g++ 11 and mingw g++ 10 say. A
# different major version says different things about different lines, in
# different words, and the audit would report hundreds of differences
# that are not regressions -- drowning the one signal it exists to give.
# tools/ci-assert-toolchain.sh says so out loud rather than leaving the
# next person to work backwards from 300 mystery diffs.

name: Nightly

on:
  schedule:
    # 03:17 UTC. Not on the hour: every scheduled workflow on the platform
    # that asks for "3am" lands on :00 together.
    - cron: '17 3 * * *'
  workflow_dispatch:

# One nightly at a time. Without this a dispatch does not supersede the
# run already going, and two of every job proceed in parallel -- six
# runners doing the same work, including two macOS ones at the most
# expensive multiplier. A newer nightly is strictly better than an older
# one, so cancelling is right here, unlike release.yml where a
# half-published release is worse than a slow one.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 6.1. All four builds with -Wall, every diagnostic diffed against the
  # committed baseline. ~6 minutes, which is why it is not pre-commit.
  #
  # In CI this audit is READ-ONLY. It flags removed warnings as well as
  # new ones, deliberately, so a legitimate fix turns this job red until
  # tools/warnings.txt is regenerated and committed in the same change.
  # That is correct behaviour with a workflow consequence: the baseline is
  # part of the diff, never something CI maintains.
  warnings:
    name: Compiler warnings
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install every toolchain the audit compiles with
        run: |
          # Force IPv4. The el9 dnf install sat for seven minutes waiting
          # out IPv6 mirror attempts, and on 2026-09-02 an apt-get on an
          # Ubuntu runner did the same for fourteen. Same disease, other
          # package manager: the runner advertises IPv6 that does not
          # route to the mirrors, and every attempt waits out its timeout.
          # Costs nothing where IPv6 works.
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev pkg-config libx11-dev \
            g++-mingw-w64-x86-64

      - name: The baseline describes these compilers
        run: tools/ci-assert-toolchain.sh

      - name: All four builds, every warning diffed
        run: tools/warning_audit.py

  # 6.2. Both surfaces, ~750 invocations.
  #
  # Given its own job on purpose. asan-sweep.sh builds its own console
  # binary with -fsanitize=address -DQTTEST into this same directory and
  # runs "make clean" on both sides of that build, so it DELETES
  # ./astrolog while it runs -- anything else on the runner that depends
  # on that binary would fail confusingly. Four of its arrangements are
  # load-bearing, including that the binary needs a short path while the
  # output file wants a long one; read its header before changing it.
  #
  # KNOWN BLIND SPOT, and it is not a defect of the sweep: that build is
  # -O0, where _FORTIFY_SOURCE is inactive -- 1 *_chk import against 10 in
  # an ordinary build. Work log item 142 was exactly that class and
  # survived a full sweep and 17 gdb runs for the reason. Nothing in this
  # job's own output will ever mention the gap; ci.yml's fortify assertion
  # is what covers it.
  sanitizer:
    name: AddressSanitizer sweep
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the console build's dependencies
        run: |
          # Force IPv4. The el9 dnf install sat for seven minutes waiting
          # out IPv6 mirror attempts, and on 2026-09-02 an apt-get on an
          # Ubuntu runner did the same for fourteen. Same disease, other
          # package manager: the runner advertises IPv6 that does not
          # route to the mirrors, and every attempt waits out its timeout.
          # Costs nothing where IPv6 works.
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      # /swe will never exist here, so the sweep runs against the bundled
      # ephemeris. The switch half never needed it; the graphics half is
      # the one that used to be claimed impossible without it, and that
      # claim was retracted on 2026-09-02 after measurement -- 224 renders,
      # 0 missing, on ephem/.
      #
      # The path must be ABSOLUTE. asan-sweep.sh builds its binary at
      # /tmp/astrolog-asan-sweep -- deliberately, since the binary needs a
      # short path -- and Astrolog resolves a relative -Yi1 against the
      # executable's own directory, so "-Yi1 ephem" there means /tmp/ephem,
      # which does not exist. The sweep would still run and still find
      # memory errors, but every body would fall back to Moshier and the
      # ephemeris code paths would go unexercised, silently. Same trap as
      # item 7.2b's baseline binary, from the other end.
      - name: Both surfaces
        env:
          ASAN_SWEEP_CFG: -Yi1 ${{ github.workspace }}/ephem
          GRAPHICS_MATRIX_CFG: -Yi1 ${{ github.workspace }}/ephem
        run: tools/asan-sweep.sh

      # A third surface the sweep does not reach. asan-sweep.sh builds its
      # own CONSOLE binary and drives the switch matrix and the graphics
      # renders; the Qt suite -- 3812 assertions, every dialog and menu --
      # ran under no sanitizer at all, even though "make qt-asan" has
      # existed the whole time and CLAUDE.md called the suite "clean under
      # AddressSanitizer".
      #
      # It was not, on 2026-09-03. A mechanical sweep replacing POSIX calls
      # with Qt ones left
      #
      #   szTmp = QDir::tempPath().toLocal8Bit().constData();
      #
      # where the QByteArray is a temporary and szTmp dangles at the
      # semicolon. Linux read bytes nothing had reused and passed 3812/0;
      # macOS segfaulted. This build reports it as a plain
      # heap-use-after-free in one run -- so it was catchable here all
      # along, by a net nobody had strung.
      #
      # detect_leaks=0 because a Qt harness that exits without unwinding
      # its widgets leaks by construction: 10,769 bytes in 115
      # allocations, none of it a defect this is looking for.
      # UndefinedBehaviorSanitizer, which is a different net rather than a
      # cheaper one. ASan finds memory errors; UBSan finds signed overflow,
      # invalid shifts, misaligned access and bad conversions -- and this
      # codebase is overwhelmingly arithmetic, which is UBSan's territory
      # and was nobody's until now. Clean on its first sweep, which makes
      # it a baseline of zero rather than a cleanup project.
      - name: UndefinedBehaviorSanitizer over both matrices
        run: tools/ubsan-sweep.sh

      - name: The Qt suite under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORMTHEME: ''
        run: |
          sudo apt-get install -y qtbase5-dev pkg-config
          make qt-asan -j4
          ASTROLOG_QT_EPHEM=minimal ./astrolog-qt-asan -Yi1 ephem

  # 6.4b. The cheap Windows differential: the whole 71-invocation chart
  # matrix run against astrolog-wcli.exe under Wine and byte-diffed
  # against the Linux console build, with no display, no window manager
  # and no input simulation. 24 seconds here.
  #
  # It is in the slow lane only because installing Wine is not cheap; the
  # harness itself is fast enough for the fast lane, and if the install
  # ever stops dominating, move it.
  #
  # It exercises the shared core as compiled by mingw for Windows, which
  # is where a portability difference would live. It compiles neither
  # wdriver.cpp nor wdialog.cpp, so it says nothing about the Windows GUI
  # -- a complement to the oracle, never a replacement.
  # 6.3 rides along in the same job. tools/win-tests.sh drives the real
  # astrolog.exe through a window under Xvfb, which is the ONLY thing in
  # this repository that exercises wdriver.cpp and wdialog.cpp
  # behaviourally -- the differential above compiles neither. Both halves
  # want Wine, and installing it is the expensive part, so they share a
  # job rather than paying for it twice.
  windows:
    name: Windows parity
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out the tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the cross toolchain and Wine
        run: |
          sudo dpkg --add-architecture i386
          # Force IPv4. The el9 dnf install sat for seven minutes waiting
          # out IPv6 mirror attempts, and on 2026-09-02 an apt-get on an
          # Ubuntu runner did the same for fourteen. Same disease, other
          # package manager: the runner advertises IPv6 that does not
          # route to the mirrors, and every attempt waits out its timeout.
          # Costs nothing where IPv6 works.
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 libx11-dev \
            wine wine64 xvfb metacity xdotool imagemagick

      - name: Build all three binaries
        run: make -j4 && make wcli -j4 && make -f Makefile.win -j4

      # Wine writes a prefix on first run and takes a while doing it; get
      # that out of the way before anything is timed or diffed.
      - name: Initialise the Wine prefix
        run: wineboot --init 2>/dev/null || true

      - name: Diff the whole chart matrix
        run: tools/win-differential.sh out/win-diff

      # 6.3. Every tools/scenarios/win-*.txt, driven through a real window.
      # windrive.sh starts its own Xvfb and its own metacity, and starts
      # metacity with PULSE_SERVER=/nonexistent because it plays the X bell
      # through the speakers and Astrolog rings the bell on every keystroke
      # it does not handle. Both builds need a window manager -- Wine will
      # not give a new dialog keyboard focus without one.
      #
      # It swaps /swe for the bundled ephem/ in a COPY of nrvate.as before
      # running: ~887,000 files through Wine's path translation is
      # indistinguishable from the app hanging. On a runner there is no
      # /swe at all, so the swap is a no-op -- which is the case to watch,
      # since a no-op swap and a broken one look identical from here.
      - name: The Windows GUI scenarios
        run: tools/win-tests.sh

      - name: Keep the diff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-differential
          path: out/win-diff/*.diff
          if-no-files-found: ignore

  # All four matrices, including the expensive one the pull-request gate
  # leaves out. switch-matrix.sh is 1,058 invocations of five processes;
  # here that is fine, and it is where the switch surface keeps its
  # coverage.
  #
  # The base is the commit as of 24 hours ago, so the report is "what
  # moved today". That is a different and weaker question than the gate's
  # "what did this change move", which is exactly why the gate exists
  # too -- if the day's diff is non-empty, the per-change runs already
  # said which change did it.
  differential:
    name: Behaviour vs yesterday
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out the tree with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install X11 headers
        run: |
          # Force IPv4. The el9 dnf install sat for seven minutes waiting
          # out IPv6 mirror attempts, and on 2026-09-02 an apt-get on an
          # Ubuntu runner did the same for fourteen. Same disease, other
          # package manager: the runner advertises IPv6 that does not
          # route to the mirrors, and every attempt waits out its timeout.
          # Costs nothing where IPv6 works.
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Diff all four against yesterday
        run: |
          base=$(git rev-list -1 --before='24 hours ago' HEAD)
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "No commit older than 24 hours to diff against, or nothing"
            echo "has landed since. Nothing to report; not inventing a base."
            exit 0
          fi
          DIFFERENTIAL_REPORT=1 tools/ci-differential.sh "$base" out/diff

      - name: Keep the diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-differential
          path: out/diff/*.diff
          if-no-files-found: ignore

  # Phase 9. Scoped to "it compiles and the suite passes", because the
  # maintainer owns no Apple hardware and nothing beyond that can be
  # verified here. The deliverable is adoptability: a dated, reproducible
  # statement that the port builds and passes on macOS, which is what
  # someone considering picking up the Mac side cannot find out without
  # doing the work first.
  #
  # IT IS IN THE NIGHTLY LANE AND NOT THE FAST ONE, and it took a wasted
  # runner to learn why. The first attempt ran "brew install qt@5", which
  # Homebrew has deprecated -- so instead of pouring a bottle it started
  # building Qt from source, and sat there for over ten minutes inside a
  # workflow whose whole run is otherwise four. "Does it still build on
  # macOS" is a daily question, not a per-push one.
  #
  # Qt6, not Qt5, for the same reason: it is a current bottle and installs
  # in seconds, and Makefile.qt picks its modules from pkg-config, so
  # nothing else changes. The EL10 package is built against Qt6 too.
  #
  # TWO THINGS TO READ HONESTLY. This is the one job in any of these
  # workflows that was NOT falsified before it was trusted -- it cannot
  # be, from a machine with no macOS -- and it is continue-on-error, so it
  # reports rather than gates, like the nightly differential. A green
  # result says the suite passed offscreen; it does not say a person can
  # use the menus. QT_CI_PLAN.md item 9.3 lists what nobody has looked at.
  macos:
    name: macOS build + suite
    runs-on: macos-latest
    # Build is about two minutes -- Qt6 pours in 59s and the port compiles
    # in 61s, both measured. The suite is 47s on Linux. Twelve minutes is
    # generous for that and cheap when something hangs.
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Qt6
        run: brew install qt pkg-config

      # Keep the build log. tools/warning_audit.py covers five GCC builds
      # and knows nothing about clang, so this job compiled 260 warnings a
      # night that nobody read -- all of them 'sprintf' is deprecated, all
      # of them in vendored Swiss Ephemeris, and none in a file this
      # codebase wrote.
      - name: Build
        run: make qt -j4 2>&1 | tee build.log && make qt-test -j4 2>&1 | tee -a build.log

      - name: No clang warnings in our own sources
        run: tools/ci-assert-clang-clean.sh build.log 300

      # Bounded, timed and line-buffered, so a hang produces a DIAGNOSIS
      # rather than a job that stops. A step's output is not served until
      # the step ends, so an unbounded run that hits the job timeout tells
      # you only that macOS is unhappy; this tells you which group it was
      # in when it stopped. Exactly how the ten-minute Linux hang was
      # localised -- to a modal box in the Chart rendering group -- in one
      # run instead of several.
      # The watchdog kills the BINARY, not the script, and the output goes
      # to a file rather than through a pipe. Both matter. Killing the
      # script leaves its child running, and an orphan holding the pipe
      # open means "tail" never sees EOF and the step hangs anyway --
      # which is what the first version did, turning a seven-minute
      # watchdog into a twelve-minute job timeout. Reading the log after
      # the fact also sidesteps the buffering that makes a piped, running
      # binary look silent, which QT_TESTING.md records as having
      # confounded three probes.
      #
      # It kills by PID, not by name. The first version used "pkill -f
      # astrolog-qt-test" with a comment arguing that CLAUDE.md's ban on
      # pkill was a developer-machine rule and a runner has exactly one
      # copy. The run disproved it: the step exited 143 having printed
      # nothing at all, not even the "tail" that follows the kill on the
      # very next line -- so what died was the step, not the suite, and
      # the diagnostic this whole arrangement exists to produce was lost.
      # A pattern that matches more than you meant is the entire reason
      # for the rule, and CI is not the exception.
      #
      # "set -m" puts the suite in its own process group so killing
      # -PGID takes the binary with the script; killing the script alone
      # is what left the orphan the comment above describes.
      - name: Run the suite
        run: |
          # Through "script", which allocates a pty, because otherwise
          # this measures nothing. run-qt-tests.sh echoes nothing before
          # line 31 -- the binary is the first thing that prints -- and
          # with stdout a plain file, stdio BLOCK-buffers it. SIGKILL
          # then discards up to 4 KB of pending output, which is why the
          # previous run left a suite.log holding exactly one line: Qt's
          # own message, on unbuffered stderr. A pty makes stdio
          # line-buffer, so at most one partial line is lost.
          set -m
          # ASTROLOG_QT_TEST_VERBOSE names each menu item before firing
          # it, flushed. The last run localised the hang to the "Firing
          # every menu item" group -- 338 items -- and stopped there. This
          # is the difference between knowing the group and knowing the
          # item, and the hook was already in qttest.cpp waiting to be
          # switched on.
          ASTROLOG_QT_EPHEM=minimal ASTROLOG_QT_TIME=1 ASTROLOG_QT_TEST_VERBOSE=1 \
            script -q /dev/null ./run-qt-tests.sh -Yi1 ephem > suite.log 2>&1 &
          suite=$!
          for i in $(seq 1 420); do
            kill -0 "$suite" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$suite" 2>/dev/null; then
            echo "== still running after 420s; killing process group $suite"
            kill -TERM -"$suite" 2>/dev/null || kill -TERM "$suite" 2>/dev/null || true
            sleep 3
            kill -KILL -"$suite" 2>/dev/null || true
          fi
          # "|| rc=$?" and not "; rc=$?" -- under "set -e" a wait that
          # reports 143 IS a failing command, so the shell exited right
          # there and the tail below never ran. That is the same lost
          # diagnostic as the pkill version, one line further down.
          rc=0; wait "$suite" || rc=$?
          tail -80 suite.log
          [ "$rc" -eq 0 ] || {
            echo "== suite exited $rc. The last group named above is where it"
            echo "== stopped; on Linux this run takes 47 seconds and the whole"
            echo "== suite passes 3792 assertions -- 3786 here, the six being"
            echo "== the Print item this build skips."
            exit "$rc"; }

      # The log leaves the runner whether the suite passed or not. "tail
      # -80" is enough to see where a failure stopped and not enough for
      # anything else -- 32 of the 48 groups' assertion counts scroll off
      # the top, and those are what tells you a group was skipped rather
      # than run. Four separate fixes to this step have now been about it
      # discarding its own evidence.
      #
      # The count to expect here is 3786, not Linux's 3792, and the log
      # this step uploads is what proves the six are benign. Diffing the
      # per-group assertion counts against a Linux run of the same
      # configuration gives 48 groups on both sides and exactly one line
      # of difference:
      #
      #   < [Firing every menu item: 957 assertions]
      #   > [Firing every menu item: 951 assertions]
      #
      # Six, in the one group that skips the Print item -- QPrintDialog is
      # the native NSPrintPanel here and runs its own Cocoa modal loop, so
      # the closer this group arms never gets a turn. Every other group
      # runs the same number of assertions on both platforms, which is the
      # thing worth knowing: a lower total is otherwise indistinguishable
      # from a group that silently did not run.
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-suite-log
          path: suite.log
          retention-days: 14

      # Build the .dmg here too, not only in release.yml. Packaging that
      # runs once per release is packaging that breaks between releases
      # and tells you at the worst moment -- the same argument that put
      # the Windows and Linux packages in this pipeline rather than in a
      # release checklist. It costs about two minutes on a job that
      # already has Qt installed and the port built.
      #
      # tools/package-macos.sh runs the bundled binary and requires a
      # Chiron line, so a break in macdeployqt's library rewriting, in the
      # ad-hoc signature, or in the data layout fails here rather than in
      # a user's Downloads folder.
      - name: Build the .app and .dmg
        run: tools/package-macos.sh out/macos

      # Upload it here too. release.yml was the only place a .dmg could
      # be obtained, so testing one meant cutting a release -- which is
      # how v8.00-qt.3 and qt.4 came to be tagged and never published.
      # A nightly artifact is the thing to hand somebody who says "does
      # this run on your Mac?" without spending a version number on it.
      - name: Say so in the run summary
        if: always()
        run: |
          {
            echo "### macOS"
            echo "- suite: $(grep -hoE '^(PASS|FAIL): .*' suite.log 2>/dev/null | tail -1 || echo 'did not report')"
            if ls out/macos/*.dmg >/dev/null 2>&1; then
              echo "- packaged: $(ls -lh out/macos/*.dmg | awk '{print $9" "$5}')"
            else
              echo "- **no .dmg produced**"
            fi
            echo "- job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload it
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolog-macos-nightly
          path: out/macos/*.dmg
          retention-days: 14
          if-no-files-found: warn

  # THE EXPERIMENT: does this port build as a Qt application on Windows,
  # with Microsoft's compiler and the open-source Qt?
  #
  # If it does, the three backends this tree carries -- WIN
  # (wdriver.cpp/wdialog.cpp), QT, and X11 -- could become one, and the
  # fork's stated spec of "parity with Windows" would stop needing to be
  # maintained by hand because both platforms would be running the same
  # code.
  #
  # Two facts make it plausible rather than a project. The Qt backend has
  # no POSIX dependency left: its three mkstemp/unlink sites became
  # QTemporaryFile on 2026-09-02, and io.cpp's dirent use already had an
  # "#ifdef PC" path. And the port uses NO Q_OBJECT anywhere, so there is
  # no moc step -- which means no qmake, no CMake, no build system at all,
  # just cl.exe over the same source list every other build uses.
  #
  # WHAT IT DOES NOT DECIDE. astrolog.rc is a build INPUT, not legacy:
  # qtrcdlg.h, qtrcaccel.h and qtrccmd.h are generated from it and four
  # audits check the port against it. And wdriver.cpp/wdialog.cpp are the
  # behavioural oracle every divergence has been judged against. A green
  # result here says "the code compiles as Qt on Windows", which is the
  # first question and not the last one.
  #
  # Exploratory, so continue-on-error and nightly: it cannot be falsified
  # from a machine with no MSVC, exactly like the macOS job.
  qt-windows:
    # Qt6 only on Windows, and the Qt5 leg that briefly lived here is
    # worth a note because the reasoning is not obvious.
    #
    # Qt 5.15.2 -- the last open source 5.15, from 2020 -- does not
    # compile against a current MSVC at all: qvarlengtharray.h uses
    # stdext::checked_array_iterator, a Microsoft STL extension now behind
    # an opt-in macro, so Qt's own header fails before any Astrolog source
    # is reached. That is fixable with one /D, but it is a workaround on a
    # dead Qt that will keep needing new workarounds.
    #
    # The one thing it bought was Windows 7: Qt6Core.dll statically
    # imports SetThreadDescription (Windows 10 1607+), so a Qt6 build does
    # not start on 7 -- measured in a VM, an instant exit with no output,
    # the loader failing before main(). And the PE header says minimum OS
    # 6.0, which would tell you the opposite.
    #
    # So this is the honest cost of a Qt-only Windows build, recorded
    # rather than discovered later: it is Windows 10 and later, where
    # wdriver.cpp runs on 7 and 8. Qt5 stays supported on LINUX, where it
    # is what the maintainer's machine has and distributions still ship
    # it; macOS is Qt6 already, Homebrew having deprecated qt@5 into a
    # source build.
    name: Qt ${{ matrix.qt }} on Windows (MSVC) -- experiment
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: "6.8.3"
            aqtarch: win64_msvc2022_64
            qtdir: msvc2022_64
            libpfx: Qt6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # aqtinstall rather than a third-party action: one pip package, no
      # new SHA to pin, and it is the tool those actions wrap anyway.
      - name: Install Qt for MSVC
        shell: pwsh
        run: |
          # aqtinstall is pinned for the same reason every action here is
          # pinned to a SHA: this job's inputs should change when someone
          # changes them. It reaches out to Qt's own mirrors, parses their
          # layout, and a release that changes how it names an archive or
          # resolves a mirror would break the build with no commit behind
          # it -- the hardest kind of failure to read, because the diff
          # that "caused" it is empty. 3.3.0 is what the runs that
          # established this job all used.
          pip install aqtinstall==3.3.0
          aqt install-qt windows desktop ${{ matrix.qt }} ${{ matrix.aqtarch }} -O ${{ github.workspace }}\Qt
          echo "QTDIR=${{ github.workspace }}\Qt\${{ matrix.qt }}\${{ matrix.qtdir }}" >> $env:GITHUB_ENV

      # No moc, no build system: the same source list Makefile.srcs gives
      # every other build, handed to cl.exe through a response file.
      # tools/qt-srcs.py reads that list rather than keeping a copy, so a
      # new source file does not have to be remembered in a sixth place --
      # verified on Linux to match the real Qt build's object list exactly.
      #
      # -DQT selects the Qt backend. -DPC is what astrolog.h wants on
      # Windows for <io.h> and backslash path separators, and is
      # independent of -DWIN -- which is the whole point of the
      # experiment: Windows without the Windows backend.
      - name: Compile with cl.exe
        shell: cmd
        run: |
          python tools\qt-srcs.py > srcs.txt || exit /b 1
          rem vswhere, not a hardcoded edition path. The first attempt
          rem guessed Enterprise then Community under
          rem "Microsoft Visual Studio\2022\" and found neither -- the
          rem runner image moves, and the edition is not something to
          rem guess at. vswhere ships with every installer since 2017 and
          rem answers where the toolset actually is.
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * ^
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
            -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH echo No MSVC toolset found & exit /b 1
          echo Using %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          rem /Zc:__cplusplus is not optional with Qt. MSVC reports
          rem __cplusplus as 199711L regardless of /std: unless told to
          rem be accurate, and Qt's qcompilerdetection.h checks the macro
          rem and refuses: "Qt requires a C++17 compiler, and a suitable
          rem value for __cplusplus". The first run with a working
          rem toolchain died there, having compiled most of the tree
          rem first -- so this is a compiler-configuration quirk, not an
          rem Astrolog portability problem.
          rem /permissive- is the second flag Qt asks for by name, for the
          rem same reason as the first: MSVC's defaults are not
          rem standards-conforming and Qt's headers check. Both messages
          rem name the flag, and neither is a complaint about this tree --
          rem Astrolog's own sources have not produced a diagnostic yet.
          rem /W3, not /W1. /W1 is MSVC's quietest setting and this job ran
          rem at it from the day it was written, which made "the MSVC build
          rem is clean" a much weaker statement than it sounded: three
          rem warnings total across the whole tree, two of them a #pragma
          rem GCC that MSVC cannot read. /W3 is the level that finds
          rem signed/unsigned mismatches, truncation and uninitialised
          rem locals -- the things a second compiler is worth having FOR.
          rem /W4 is noisier than it is useful on a codebase this old.
          rem
          rem /Zc:strictStrings- goes AFTER /permissive-, which implies the
          rem positive form. The tree initialises char * from string
          rem literals in 1,345 places -- three data tables are 96% of it --
          rem and all six makefiles already pass -Wno-write-strings for the
          rem same reason. Deferred deliberately: this job exists to find the
          rem NEXT obstacle, not to fund a const sweep. See QT_CI_PLAN.md.
          rem _CRT_SECURE_NO_WARNINGS below silences C4996: MSVC deprecates
          rem fopen, getenv, strcpy and sscanf for _s variants that exist
          rem only on its own compiler, 850 of them at /W3. A portability
          rem opinion rather than a defect. NOTE: rem cannot appear between
          rem "cl" and its last "^" continuation -- cmd passes the word to
          rem the compiler as a source file, and the build dies with
          rem "LNK1181: cannot open input file 'rem.obj'". It did.
          cl /nologo /std:c++17 /Zc:__cplusplus /permissive- /Zc:strictStrings- /EHsc /MD /O2 /W3 ^
             /D_CRT_SECURE_NO_WARNINGS ^
             /DQT /DPC /DWIN32 /D_WINDOWS /DNDEBUG ^
             /I"%QTDIR%\include" /I"%QTDIR%\include\QtCore" ^
             /I"%QTDIR%\include\QtGui" /I"%QTDIR%\include\QtWidgets" ^
             /I"%QTDIR%\include\QtNetwork" /I"%QTDIR%\include\QtPrintSupport" ^
             @srcs.txt ^
             /Fe:astrolog-qt.exe ^
             /link /LIBPATH:"%QTDIR%\lib" ^
             ${{ matrix.libpfx }}Widgets.lib ${{ matrix.libpfx }}Gui.lib ^
             ${{ matrix.libpfx }}Core.lib ${{ matrix.libpfx }}Network.lib ^
             ${{ matrix.libpfx }}PrintSupport.lib ^
             user32.lib gdi32.lib shell32.lib advapi32.lib ole32.lib

      # Not just "did it link" -- does it compute? A Qt build has
      # astrolog.cpp's ordinary main(), because that is inside "#ifndef
      # WIN" and this build does not define WIN. So unlike astrolog.exe it
      # can be driven from a command line, and the same Chiron assertion
      # the Linux packages use applies: 0Ari00 is the no-ephemeris answer,
      # and the Sun reads correctly even with no ephemeris at all.
      - name: Does it run, and compute?
        shell: pwsh
        run: |
          if (-not (Test-Path astrolog-qt.exe)) { "No binary produced."; exit 1 }
          "built: $((Get-Item astrolog-qt.exe).Length) bytes"
          $env:PATH = "$env:QTDIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          # "-os <file>" and not stdout, because a QT build writes NO
          # chart to stdout on ANY platform. Measured on Linux: the
          # console build prints 136 lines, ./astrolog-qt prints zero and
          # exits 0. So the first two versions of this step were asking
          # the binary for something it never does, and the Windows job
          # was reporting a defect in the test.
          #
          # This is what the previous fix bought. That version reported
          # "stdout (first 12 lines):" followed by nothing, which is a
          # true statement about the program; the version before it hid
          # the same fact behind PowerShell folding stderr into the
          # object stream. A harness that lies costs more than one that
          # fails.
          & .\astrolog-qt.exe -Yi1 ephem -qa 6 15 1990 12:00 0 122W19 47N36 -R1 _X -os chart.txt 2> chart.err
          $chiron = (Get-Content chart.txt -ErrorAction SilentlyContinue | Where-Object { $_ -match '^Chir' } | Select-Object -First 1)
          if (-not $chiron) {
            "No Chiron line. chart.txt (first 12 lines):"
            Get-Content chart.txt -TotalCount 12 -ErrorAction SilentlyContinue
            "stderr:"; Get-Content chart.err -TotalCount 6 -ErrorAction SilentlyContinue
            exit 1 }
          if ($chiron -match '0Ari00') { "EPHEMERIS NOT FOUND: $chiron"; exit 1 }
          "Qt on Windows computes: $chiron"

      # The binary leaves the runner, because the interesting questions
      # about it cannot be answered here. This job proves it builds and
      # computes; whether 25 dialogs lay out correctly under a Windows
      # style, and whether the 3812-assertion suite passes, needs a real
      # Windows desktop. Qt's own DLLs go with it -- windeployqt is the
      # supported way to work out which, rather than guessing a list.
      # The same source list again with -DQTTEST, which is what
      # run-qt-tests.sh drives. Without it the artifact can only be
      # eyeballed; with it, 3812 assertions -- 25 dialogs, 42 context
      # menus, 264 shortcuts -- can run on a real Windows desktop, which
      # is the one question this job structurally cannot answer itself.
      # A second cl.exe pass over the same sources is about a minute.
      - name: Compile the test build too
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * ^
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
            -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          python tools\qt-srcs.py --test > srcst.txt || exit /b 1
          rem _CRT_SECURE_NO_WARNINGS below silences C4996: MSVC deprecates
          rem fopen, getenv, strcpy and sscanf for _s variants that exist
          rem only on its own compiler, 850 of them at /W3. A portability
          rem opinion rather than a defect. NOTE: rem cannot appear between
          rem "cl" and its last "^" continuation -- cmd passes the word to
          rem the compiler as a source file, and the build dies with
          rem "LNK1181: cannot open input file 'rem.obj'". It did.
          cl /nologo /std:c++17 /Zc:__cplusplus /permissive- /Zc:strictStrings- /EHsc /MD /O2 /W3 ^
             /D_CRT_SECURE_NO_WARNINGS ^
             /DQT /DQTTEST /DPC /DWIN32 /D_WINDOWS /DNDEBUG ^
             /I"%QTDIR%\include" /I"%QTDIR%\include\QtCore" ^
             /I"%QTDIR%\include\QtGui" /I"%QTDIR%\include\QtWidgets" ^
             /I"%QTDIR%\include\QtNetwork" /I"%QTDIR%\include\QtPrintSupport" ^
             @srcst.txt ^
             /Fe:astrolog-qt-test.exe ^
             /link /LIBPATH:"%QTDIR%\lib" ^
             ${{ matrix.libpfx }}Widgets.lib ${{ matrix.libpfx }}Gui.lib ^
             ${{ matrix.libpfx }}Core.lib ${{ matrix.libpfx }}Network.lib ^
             ${{ matrix.libpfx }}PrintSupport.lib ^
             user32.lib gdi32.lib shell32.lib advapi32.lib ole32.lib

      # Run the suite HERE, not only in a VM by hand. The runner has
      # everything needed: the -DQTTEST binary, Qt's DLLs, and
      # qoffscreen.dll -- which is the whole trick, because a Windows
      # runner has no desktop and the "windows" platform plugin blocks
      # forever on the first widget. Offscreen needs no display at all.
      #
      # Until now these 3812 assertions ran on Windows only when someone
      # copied an artifact into a VirtualBox VM and invoked
      # tools/win-vm-suite.sh, which is a real check and not a repeatable
      # one. 25 dialogs, 42 context menus, 264 shortcuts and 338 menu
      # items are exactly the surface a Windows port can break without
      # any Linux net noticing.
      #
      # ASTROLOG_QT_EPHEM=minimal because the bundled ephem/ carries 19 of
      # the 39 esoteric bodies, and the suite refuses to quietly run 19
      # assertions where it should run 39.
      - name: Run the suite on Windows
        shell: cmd
        run: |
          set QT_QPA_PLATFORM=offscreen
          set ASTROLOG_QT_EPHEM=minimal
          if not exist platforms mkdir platforms
          copy "%QTDIR%\plugins\platforms\qoffscreen.dll" platforms\ >nul
          copy "%QTDIR%\bin\Qt6*.dll" . >nul
          astrolog-qt-test.exe -Yi1 ephem
          if errorlevel 1 exit /b 1

      # Say what happened where the run summary shows it. Both experiments
      # are continue-on-error, which means a failure inside them leaves the
      # RUN green and someone has to go looking at job level to find it.
      # A summary line is the difference between "the nightly passed" and
      # "the nightly passed and here is what each platform actually did".
      - name: Say so in the run summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Qt ${{ matrix.qt }} on Windows (MSVC)"
            if [ -f astrolog-qt.exe ]; then
              echo "- built \`astrolog-qt.exe\`, $(stat -c%s astrolog-qt.exe 2>/dev/null || stat -f%z astrolog-qt.exe) bytes"
            else
              echo "- **did not build**"
            fi
            [ -f astrolog-qt-test.exe ] && echo "- built the -DQTTEST binary too"
            echo "- job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage a runnable tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item astrolog-qt.exe dist\
          Copy-Item astrolog-qt-test.exe dist\
          & "$env:QTDIR\bin\windeployqt.exe" --release --no-translations `
            --no-system-d3d-compiler --no-opengl-sw dist\astrolog-qt.exe
          # windeployqt ships only the "windows" platform plugin, and the
          # suite needs "offscreen": run-qt-tests.sh sets
          # QT_QPA_PLATFORM=offscreen so 3812 assertions can run with no
          # display. Without it the binary exits at once with "Could not
          # find the Qt platform plugin", and with the windows plugin
          # instead it blocks forever -- a guestcontrol process runs in
          # session 0, which has no desktop to attach a window to. Both
          # measured, the second by a ten-minute hang.
          Copy-Item "$env:QTDIR\plugins\platforms\qoffscreen.dll" dist\platforms\
          Copy-Item "$env:QTDIR\plugins\platforms\qminimal.dll" dist\platforms\
          # icons/ too, and not as an afterthought. IconAstrologQt() tries
          # icons/astrolog{16,32,48}.png beside the executable and then
          # falls back to astrlog1.ico, and the suite's "Application icon"
          # group asserts all three sizes resolve at their exact size
          # rather than as a scaled blur. The artifact had NEITHER source,
          # which cost 8 of the 15 failures in the first Windows run of
          # the suite -- a packaging gap reported as a port defect.
          # Confirmed by removing both locally: 0 passed, 8 failed, the
          # same eight. Removing only icons/ still passes, off the .ico.
          Copy-Item -Recurse ephem, font, icons dist\
          Copy-Item astrolog.as, atlas.as, timezone.as, sefstars.txt, `
            seorbel.txt, astexo.csv, earth.bmp, astrlog1.ico dist\
          "staged $((Get-ChildItem dist -Recurse -File).Count) files, " +
            "$([math]::Round((Get-ChildItem dist -Recurse -File | Measure-Object Length -Sum).Sum/1MB,1)) MB"

      - name: Upload it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astrolog-${{ matrix.libpfx }}-windows-msvc
          path: dist/
          retention-days: 14
